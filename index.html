<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mr. D’s Sims</title>
<meta name="description" content="Guided lessons, virtual labs and simulations for Mr. D’s physics, chemistry and calculus classes.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/hub.css">
<style>
.classes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:18px;padding:18px clamp(16px,4vw,56px) 40px}
.class{display:flex;flex-direction:column;min-height:min(46vh,380px);border-radius:14px;overflow:hidden;text-decoration:none;border:1px solid var(--hub-line);background:linear-gradient(160deg,var(--c1),var(--hub-surface) 70%);transition:transform .15s,border-color .15s}
.class:hover,.class:focus-visible{transform:scale(1.02);border-color:#fff}
.class .big{font-size:clamp(3rem,7vw,5rem);padding:22px 24px 0}
.class h2{font:800 clamp(1.8rem,4vw,2.6rem)/1 var(--display);margin:6px 24px 6px}
.class p{margin:0 24px;color:#cfdbe7}
.class .counts{margin:auto 24px 20px;padding-top:16px;display:flex;gap:8px;flex-wrap:wrap}
.counts span{font:700 .78rem var(--mono);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:2px 12px}
</style>
</head>
<body class="hub">
<header class="hero"><h1>Mr. D’s Sims</h1><p>Guided lessons, virtual labs and simulations. Pick your class.</p><span class="now off" id="now"><i></i><span id="nowtxt"></span></span></header>
<main class="classes" id="classes"></main>
<footer class="hubfoot"><a href="portal/index.html">Review portal</a> · <a href="portal/feedback.html">My lab feedback</a> · <a href="teacher/index.html">Teacher dashboard</a>
<script src="shared/bell.js"></script>
<script src="physics/sims.js"></script><script>window.PHYS=window.UNITS;</script>
<script src="chemistry/labs.js"></script><script>window.CHEM=window.UNITS;</script>
<script src="calculus/sims.js"></script><script>window.CALC=window.UNITS;</script>
<script>
(function(){
  function count(units){var c={lesson:0,lab:0,sim:0};units.forEach(function(u){(u.entries||[]).forEach(function(x){c[x.type||u.type||"sim"]++})});return c}
  var cls=[["physics","Physics","⚛️","hsl(215 70% 30%)",window.PHYS,"Forces, motion and energy. Guided lessons and free-play sims."],
           ["chemistry","Chemistry","🧪","hsl(172 65% 24%)",window.CHEM,"Atoms, matter and reactions. Guided lessons and virtual labs."],
           ["calculus","Calculus","∫","hsl(265 55% 32%)",window.CALC,"AP Calculus AB. Lessons that adjust to you, and sims."]];
  var host=document.getElementById("classes");
  cls.forEach(function(c){var n=count(c[4]),a=document.createElement("a");a.className="class";a.href=c[0]+"/";a.style.setProperty("--c1",c[3]);
    a.innerHTML='<div class="big" aria-hidden="true">'+c[2]+'</div><h2>'+c[1]+'</h2><p>'+c[5]+'</p><div class="counts"><span>'+n.lesson+' lessons</span><span>'+n.lab+' virtual labs</span><span>'+n.sim+' sims</span></div>';
    host.appendChild(a)});
  var k=MrD.bell.clock("physics"),names={physics:"Physics",chem:"Chemistry",calc:"Calculus"},live=null;
  ["physics","chem","calc"].forEach(function(c){var s=MrD.bell.clock(c);if(s.mode==="class")live=names[c]+" is in session until "+MrD.bell.fmtTime(s.session.end)});
  var el=document.getElementById("now");if(live){el.classList.remove("off");document.getElementById("nowtxt").textContent=live}else{document.getElementById("nowtxt").textContent=MrD.bell.gatesOn()?"Huddle codes are on until 3:00 PM":"Home mode: no huddle codes right now"}
})();
</script>
</body>
</html>
