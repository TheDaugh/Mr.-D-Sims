<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculus Sims</title>
<meta name="description" content="AP Calculus AB simulations for Mr. D's classes.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef2f6; --surface:#ffffff; --ink:#142230; --muted:#566878; --line:#cbd6e0; --accent:#2b4fd9;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e161e; --surface:#16212b; --ink:#e6edf3; --muted:#92a3b3; --line:#2a3a48; --accent:#8aa4ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e161e; --surface:#16212b; --ink:#e6edf3; --muted:#92a3b3; --line:#2a3a48; --accent:#8aa4ff; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);padding-inline:16px;padding-block:18px 48px}
.wrap{max-width:1080px;margin-inline:auto}
.top{display:flex;gap:12px;align-items:baseline;margin-bottom:10px}
.back{font:600 .8rem var(--mono);color:var(--muted);text-decoration:none}
.back:hover{color:var(--accent)}
.crumb{font:400 .8rem var(--mono);color:var(--muted)}
h1{font:800 clamp(1.8rem,5vw,2.6rem)/1.05 var(--display);letter-spacing:-.02em;margin:0 0 .35rem}
.lead{color:var(--muted);margin:0;max-width:62ch}
h2{font:600 .75rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:26px 0 4px}
.hint{margin:0 0 10px;color:var(--muted);font-size:.92rem}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(17rem,1fr));gap:12px}
.card{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px;text-decoration:none;color:var(--ink);min-width:0}
.card:hover{border-color:var(--accent)}
.card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card h3{font:800 1.15rem/1.15 var(--display);margin:0}
.card p{font-size:.92rem;color:var(--muted);margin:0;flex:1}
.tlinks{display:flex;flex-wrap:wrap;gap:6px 14px;font:600 .78rem var(--mono);margin:6px 2px 0;padding:6px 8px;border:1px dashed var(--line);border-radius:4px}
.tlinks a{color:var(--accent)}
.tmode{margin-top:30px;font:400 .75rem var(--mono);color:var(--muted)}
.tmode button{background:none;border:0;color:inherit;font:inherit;text-decoration:underline;cursor:pointer;padding:0}
.pill{display:inline-block;font:400 .72rem var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:1px 7px;margin:0 6px 4px 0}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="back" href="../">← All sims</a>
    <span class="crumb">Mr. D's Sims</span>
  </header>
  <h1>Calculus Sims</h1>
  <p class="lead">AP Calculus AB, by unit. Drag things, watch the graph respond, then explain what you saw.</p>
  <main id="units"></main>
  <p class="tmode"><button type="button" id="tmode">Teacher view</button></p>
</div>
<script src="sims.js"></script>
<script>
(function () {
  var root = document.getElementById("units");
  var TEACHER = false;
  try { if (/(^|[#&])teacher\b/.test(location.hash)) localStorage.setItem("mrd.teacher", "1"); TEACHER = localStorage.getItem("mrd.teacher") === "1"; } catch (e) { TEACHER = /teacher/.test(location.hash); }
  var tb = document.getElementById("tmode");
  tb.textContent = TEACHER ? "Hide teacher links" : "Teacher view";
  tb.onclick = function () { try { localStorage.setItem("mrd.teacher", TEACHER ? "0" : "1"); } catch (e) {} location.hash = ""; location.reload(); };
  window.UNITS.forEach(function (u) {
    var sec = document.createElement("section");
    var h = document.createElement("h2"); h.textContent = u.title; sec.appendChild(h);
    var p = document.createElement("p"); p.className = "hint"; p.textContent = u.blurb; sec.appendChild(p);
    var cards = document.createElement("div"); cards.className = "cards";
    u.sims.forEach(function (s) {
      var wrap = document.createElement("div");
      var a = document.createElement("a"); a.className = "card"; a.href = s.href;
      var t = document.createElement("h3"); t.textContent = s.title;
      var b = document.createElement("p"); b.textContent = s.blurb;
      a.appendChild(t); a.appendChild(b);
      var tags = document.createElement("div");
      s.tags.forEach(function (tag) { var sp = document.createElement("span"); sp.className = "pill"; sp.textContent = tag; tags.appendChild(sp); });
      a.appendChild(tags); wrap.appendChild(a);
      if (TEACHER && s.teacher) {
        var tl = document.createElement("div"); tl.className = "tlinks";
        s.teacher.forEach(function (l) { var x = document.createElement("a"); x.href = l.href; x.textContent = l.label; tl.appendChild(x); });
        wrap.appendChild(tl);
      }
      cards.appendChild(wrap);
    });
    sec.appendChild(cards); root.appendChild(sec);
  });
})();
</script>
</body>
</html>
