<style>
:root{--teal:#2AACAF;--deep:#17777A;--wash:#E6F6F6;--ink:#1A1A1A;--mute:#5a6b6b;--bg:#F4FAFA;--line:#CFE6E6;--orange:#E8833A;--navy:#1B3A57;--good:#2E8B57;--bad:#C0392B;--gold:#F2B84B;--cream:#FFF6E2;--yel:#F6E7A8;--blu:#BCD3EE}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:Arial,"Helvetica Neue",Helvetica,sans-serif;background:var(--bg);color:var(--ink);font-size:18px;line-height:1.4}
header{background:var(--teal);color:#fff;padding:10px 18px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:21px}header a{color:#fff}
#chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.25);border-radius:999px;padding:3px 11px;font-size:14px;font-weight:bold;white-space:nowrap}
.chip.on{background:#fff;color:var(--deep)}.chip.done{background:var(--deep)}
#app{max-width:980px;margin:0 auto;padding:16px 14px 90px}
.card{background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px 18px;margin:14px 0}
.text{background:var(--wash);border-color:var(--teal)}
h2{margin:6px 0 2px;font-size:28px;color:var(--deep)}.sub{color:var(--mute);margin:0 0 6px}
button{font:inherit;cursor:pointer}
.btn{background:var(--deep);color:#fff;border:0;border-radius:10px;padding:10px 20px;font-weight:bold;font-size:18px}
.btn:hover{background:#0f6366}.btn.ghost{background:#fff;color:var(--deep);border:2px solid var(--deep)}
.btn:disabled{background:#9bb;cursor:not-allowed}.btn.big{padding:14px 28px;font-size:22px}
.q{font-size:20px;font-weight:bold;margin:8px 0}
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:10px;padding:10px 14px;margin:7px 0;font-size:18px;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--teal);background:var(--wash)}.opt:disabled{cursor:default}
.opt.ok{border-color:var(--good);background:#EFF9F3}.opt.no{border-color:var(--bad);background:#FDEBEB}
.fb{border-radius:8px;padding:6px 12px;margin-top:8px;font-size:17px}
.fb.no{background:#FDEBEB;border:2px solid var(--bad)}.fb.ok{background:#EFF9F3;border:2px solid var(--good)}
.hintbox{background:var(--cream);border:2px solid var(--gold);border-radius:8px;padding:6px 12px;margin-top:8px;font-size:17px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:8px}
input[type=text],input[type=number],input[type=password]{font:inherit;font-size:20px;padding:8px 10px;border:2px solid var(--deep);border-radius:8px;width:150px}
table.tw{border-collapse:collapse;margin:8px 0;font-size:19px}
table.tw td,table.tw th{border:2px solid #555;padding:6px 14px;text-align:center}
table.tw th{background:#eef3f3}table.tw td.tot,table.tw th.tot{background:#f7f7f7;font-weight:bold}
.streak{display:flex;gap:6px;align-items:center;font-size:16px;color:var(--mute)}
.pip{width:22px;height:22px;border-radius:50%;border:2px solid var(--deep);background:#fff}.pip.on{background:var(--good);border-color:var(--good)}
.keyline{margin-top:10px;padding:8px 10px;border-left:4px solid var(--good);background:rgba(60,160,90,.1);font-size:16px}
svg.bars{width:100%;max-width:520px;height:auto;display:block}
.sliderrow{display:flex;gap:12px;align-items:center;margin:8px 0}.sliderrow b{min-width:170px}
input[type=range]{flex:1;height:34px;accent-color:var(--orange)}
.val{font-size:22px;font-weight:bold;min-width:70px;text-align:right;color:#A4510F}
.help{float:right;font-size:15px}
.overlay{position:fixed;inset:0;background:rgba(20,40,40,.92);z-index:60;display:flex;align-items:center;justify-content:center}
.overlay .card{max-width:560px}.overlay[hidden]{display:none}
.pin{width:160px}.pesMsg.no{color:var(--bad);font-weight:bold}
table.sum{margin:10px auto;border-collapse:collapse;font-size:17px}table.sum td,table.sum th{border:1.5px solid #999;padding:5px 12px;text-align:left}
#start{max-width:640px;margin:30px auto}
@media(max-width:640px){body{font-size:16px}h2{font-size:23px}}
</style>

<body>
<div id="tb"></div>
<header><h1><a href="../index.html">&larr;</a> Practice 4.1 &amp; 4.2 · Concept Checker</h1><div id="chips"></div></header>
<main id="app"></main>
<div class="overlay" id="lockres" hidden><div class="card">
  <h2>Mr. D needs to see you</h2><p id="lockresTxt"></p>
  <div class="row"><input id="lockCode" type="password" inputmode="numeric" aria-label="Unlock code from Mr. D"><button class="btn" id="bUnlock">Unlock</button></div>
  <p id="lockMsg" class="pesMsg no"></p></div></div>
<div class="overlay" id="cpLock" hidden><div class="card" id="cpLockHost"></div></div>
<script src="../../shared/config.js"></script>
<script src="../../shared/bell.js"></script>
<script src="../../shared/codes.js"></script>
<script src="../../shared/lock.js"></script>
<script src="../../shared/teacherbar.js"></script>
<script src="../../shared/ids.js"></script>
<script type="module">
import * as CK from "../../shared/virtual-lab/checkpoint.js";
import { h } from "../../shared/virtual-lab/dom.js";

const LESSON_ID = "stats-4-1-4-2-practice";
const KEY = MrD.isKey(), NOLOCK = (/nolock=(\d+)/.exec(location.hash) || [])[1];
const $ = (i) => document.getElementById(i);
const app = $("app");

/* ---------- contexts: one 2x2 table each; rows are the groups, columns are yes / no ---------- */
const CTX = [
  { who: "students", head: "Grade", lab: ["Senior", "Junior"], grp: ["seniors", "juniors"], cols: ["Job", "No job"], yes: "have a job" },
  { who: "students", head: "Lives in", lab: ["House", "Apartment"], grp: ["students in a house", "students in an apartment"], cols: ["Dog", "No dog"], yes: "have a dog" },
  { who: "students", head: "Grade level", lab: ["Underclass", "Upperclass"], grp: ["underclassmen", "upperclassmen"], cols: ["iPhone", "Other"], yes: "use an iPhone" },
  { who: "customers", head: "Time", lab: ["Morning", "Afternoon"], grp: ["morning customers", "afternoon customers"], cols: ["Coffee", "No coffee"], yes: "buy coffee" },
  { who: "players", head: "Team", lab: ["Varsity", "JV"], grp: ["varsity players", "JV players"], cols: ["Stretches", "Does not"], yes: "stretch before games" },
  { who: "students", head: "Grade", lab: ["Freshman", "Sophomore"], grp: ["freshmen", "sophomores"], cols: ["Bikes", "Does not"], yes: "bike to school" }
];
let seed = Date.now() % 100000;
const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
const pick = (a) => a[Math.floor(rnd() * a.length)];
const pct = (p, o) => Math.round(100 * p / o);

/* A table: n[r][c]. r = 0,1 (groups); c = 0 yes, 1 no. Totals worked out. */
function makeTable(c, assoc) {
  const R = [ri(2, 12) * 10, ri(2, 12) * 10];   // tens, so every group percent is a whole number
  let p0 = ri(2, 8) * 10, p1;
  if (assoc === false) p1 = p0; else if (assoc === true) { do { p1 = ri(1, 9) * 10; } while (Math.abs(p1 - p0) < 30); } else p1 = ri(1, 9) * 10;
  const yes = [Math.round(R[0] * p0 / 100), Math.round(R[1] * p1 / 100)];
  const n = [[yes[0], R[0] - yes[0]], [yes[1], R[1] - yes[1]]];
  return { c, n, R, C: [n[0][0] + n[1][0], n[0][1] + n[1][1]], N: R[0] + R[1] };
}
function tableEl(t) {
  const c = t.c;
  return h("table", { class: "tw" },
    h("tr", {}, h("th", {}, c.head), h("th", {}, c.cols[0]), h("th", {}, c.cols[1]), h("th", { class: "tot" }, "Total")),
    ...[0, 1].map(r => h("tr", {}, h("th", {}, c.lab[r]), h("td", {}, String(t.n[r][0])), h("td", {}, String(t.n[r][1])), h("td", { class: "tot" }, String(t.R[r])))),
    h("tr", {}, h("th", { class: "tot" }, "Total"), h("td", { class: "tot" }, String(t.C[0])), h("td", { class: "tot" }, String(t.C[1])), h("td", { class: "tot" }, String(t.N))));
}

/* One percent question, used by "out-of" and "percent" types. */
function pctQ(t) {
  const c = t.c, r = ri(0, 1), kind = pick(["row", "row", "col", "all", "joint"]);
  if (kind === "row") return { text: `Of the ${c.grp[r]}, what percent ${c.yes}?`, part: t.n[r][0], outof: t.R[r], why: `the ${c.grp[r]} total` };
  if (kind === "col") return { text: `Of the ${c.who} who ${c.yes}, what percent are ${c.grp[r]}?`, part: t.n[r][0], outof: t.C[0], why: `the total of ${c.who} who ${c.yes}` };
  if (kind === "all") return { text: `What percent of all the ${c.who} ${c.yes}?`, part: t.C[0], outof: t.N, why: "the grand total, everyone" };
  return { text: `What percent of all the ${c.who} are ${c.grp[r]} who ${c.yes}?`, part: t.n[r][0], outof: t.N, why: "the grand total, everyone" };
}

/* ---------- the five checkpoint types ---------- */
const TYPES = [
  { id: "read", title: "Read the table", sub: "Find the row, find the column, read where they meet.",
    make() {
      const t = makeTable(pick(CTX)), c = t.c, r = ri(0, 1), k = pick(["cell", "cell", "row", "col"]), col = ri(0, 1);
      if (k === "cell") return { t, text: `How many ${c.grp[r]} are in the "${c.cols[col]}" column?`, answer: t.n[r][col], hint: `Find the ${c.lab[r]} row and the ${c.cols[col]} column. Read where they meet.` };
      if (k === "row") return { t, text: `How many ${c.grp[r]} were asked in all?`, answer: t.R[r], hint: `All the ${c.grp[r]} is the total at the end of the ${c.lab[r]} row.` };
      return { t, text: `How many ${c.who} in all are in the "${c.cols[col]}" column?`, answer: t.C[col], hint: `A whole column's total is in the Total row at the bottom of the ${c.cols[col]} column.` };
    }, input: "num", check: (q, v) => +v === q.answer },
  { id: "outof", title: "Pick the out-of", sub: "The out-of is the group right after \"Of the\". \"Of all\" means everyone.",
    make() {
      const t = makeTable(pick(CTX)), p = pctQ(t);
      const opts = [...new Set([t.R[0], t.R[1], t.C[0], t.C[1], t.N])];
      return { t, text: p.text + " Which number is the out-of?", answer: p.outof, opts, hint: `Read the words after "Of the" (or "of all"). Here the out-of is ${p.why}.` };
    }, input: "mc", check: (q, v) => +v === q.answer },
  { id: "pct", title: "Percent from a table", sub: "percent = part ÷ out-of × 100. Round to a whole percent.",
    make() {
      const t = makeTable(pick(CTX)), p = pctQ(t);
      return { t, text: p.text, answer: pct(p.part, p.outof), hint: `The out-of is ${p.why}: ${p.outof}. The part is ${p.part}. Divide, then times 100.` };
    }, input: "num", unit: "%", check: (q, v) => Math.abs(+v - q.answer) <= 1 },
  { id: "assoc", title: "Is there an association?", sub: "Compare percents, not counts.",
    make() {
      const c = pick(CTX), a = rnd() < 0.5, t = makeTable(c, a), P = [pct(t.n[0][0], t.R[0]), pct(t.n[1][0], t.R[1])];
      const hi = P[0] >= P[1] ? 0 : 1, lo = 1 - hi;
      const right = a ? `There is an association. Of the ${c.grp[hi]}, ${P[hi]}% ${c.yes}, but of the ${c.grp[lo]}, only ${P[lo]}%.`
                      : `There is no association. ${P[0]}% of the ${c.grp[0]} and ${P[1]}% of the ${c.grp[1]} ${c.yes}.`;
      const big = t.n[0][0] >= t.n[1][0] ? 0 : 1;
      const wrong = [
        a ? `There is no association. ${P[0]}% of the ${c.grp[0]} and ${P[1]}% of the ${c.grp[1]} ${c.yes}.`
          : `There is an association. Of the ${c.grp[0]}, ${P[0]}% ${c.yes}, but of the ${c.grp[1]}, ${P[1] >= 40 ? P[1] - 30 : P[1] + 30}%.`,
        `There is an association, because ${t.n[big][0]} ${c.grp[big]} ${c.yes} and only ${t.n[1 - big][0]} ${c.grp[1 - big]} do.`,
        `There is an association. ${pct(t.n[0][0], t.N)}% of all ${c.who} are ${c.grp[0]} who ${c.yes}.`
      ];
      if (t.n[0][0] === t.n[1][0]) wrong[1] = `There is no association, because the two groups have different totals.`;
      return { t, text: `Is ${c.head.toLowerCase()} associated with whether they ${c.yes}? Pick the best answer.`, answer: right, opts: [right, ...wrong].sort(() => rnd() - 0.5),
        hint: `Turn each group into a percent of its own group. ${c.grp[0]}: ${t.n[0][0]} ÷ ${t.R[0]} = ${P[0]}%. ${c.grp[1]}: ${t.n[1][0]} ÷ ${t.R[1]} = ${P[1]}%. Same or different?` };
    }, input: "mc", check: (q, v) => v === q.answer },
  { id: "seg", title: "Read a segmented bar graph", sub: "Each bar is one group out of 100. Read where the line sits.",
    make() {
      const c = pick(CTX), P = [ri(1, 19) * 5, ri(1, 19) * 5], r = ri(0, 1), ask = pick(["yes", "no"]);
      return { c, P, text: ask === "yes" ? `What percent of the ${c.grp[r]} ${c.yes}?` : `What percent of the ${c.grp[r]} do not ${c.yes}?`,
        answer: ask === "yes" ? P[r] : 100 - P[r], hint: `Find the line inside the ${c.lab[r]} bar and read the percent axis. The ${c.cols[0]} part is the shaded bottom; the rest of the bar is ${c.cols[1]}, and the bar adds to 100.` };
    }, input: "num", unit: "%", check: (q, v) => Math.abs(+v - q.answer) <= 2 }
];
const NP = TYPES.length + 1;          // the bar builder sits between "pct" and "assoc"
const ORDER = ["read", "outof", "pct", "build", "assoc", "seg"];

function barsSvg(c, P, opt = {}) {
  const W = 520, H = 300, L = 54, B = 250, T = 20, bw = 110, xs = [L + 70, L + 260];
  const y = (p) => B - (B - T) * p / 100;
  const s = [`<svg class="bars" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Segmented bar graph">`];
  for (let p = 0; p <= 100; p += 10) s.push(`<line x1="${L}" x2="${W - 20}" y1="${y(p)}" y2="${y(p)}" stroke="#ddd"/><text x="${L - 8}" y="${y(p) + 5}" text-anchor="end" font-size="13">${p}</text>`);
  s.push(`<text x="14" y="${(B + T) / 2}" font-size="13" transform="rotate(-90 14 ${(B + T) / 2})" text-anchor="middle">percent</text>`);
  [0, 1].forEach(i => {
    const x = xs[i] - bw / 2, p = P[i];
    if (p != null) s.push(`<rect x="${x}" y="${y(p)}" width="${bw}" height="${B - y(p)}" fill="#F6E7A8" stroke="#222" stroke-width="2"/>`);
    s.push(`<rect x="${x}" y="${T}" width="${bw}" height="${B - T}" fill="none" stroke="#222" stroke-width="2"/>`);
    if (p != null) s.push(`<line x1="${x}" x2="${x + bw}" y1="${y(p)}" y2="${y(p)}" stroke="#222" stroke-width="3"/>`);
    if (opt.labels && p != null) { s.push(`<text x="${xs[i]}" y="${(y(p) + B) / 2 + 6}" text-anchor="middle" font-weight="bold">${p}%</text><text x="${xs[i]}" y="${(y(p) + T) / 2 + 6}" text-anchor="middle" font-weight="bold">${100 - p}%</text>`); }
    s.push(`<text x="${xs[i]}" y="${B + 24}" text-anchor="middle" font-size="16" font-weight="bold">${c.lab[i]}</text>`);
  });
  s.push(`<rect x="${W - 140}" y="${T}" width="16" height="14" fill="#F6E7A8" stroke="#222"/><text x="${W - 118}" y="${T + 12}" font-size="14">${c.cols[0]}</text>`);
  s.push(`<rect x="${W - 140}" y="${T + 22}" width="16" height="14" fill="#fff" stroke="#222"/><text x="${W - 118}" y="${T + 34}" font-size="14">${c.cols[1]}</text></svg>`);
  const d = document.createElement("div"); d.innerHTML = s.join(""); return d.firstChild;
}

/* ---------- state (saved per day, so a reload or a lock does not wipe it) ---------- */
const SKEY = "cc:" + LESSON_ID + ":" + MrD.bell.dayKey();
let ST = null;
const fresh = () => ({ id: "", period: "", part: 0, started: false, finished: false, t0: Date.now(), cps: Object.fromEntries(TYPES.map(T => [T.id, CK.track()])), lock: null, build: 0, answered: 0, misses: 0 });
const save = () => { if (KEY) return; try { localStorage.setItem(SKEY, JSON.stringify(ST)); } catch (e) { } if (lockArmed) LessonLock.save(ST.part, false, null); };
const load = () => { try { return JSON.parse(localStorage.getItem(SKEY)); } catch (e) { return null; } };
let lockArmed = false;

function chips() {
  $("chips").replaceChildren(...ORDER.map((id, i) => h("span", { class: "chip" + (i < ST.part || ST.finished ? " done" : i === ST.part ? " on" : "") }, (i < ST.part || ST.finished ? "✓ " : "") + (i + 1))),
    ...(lockArmed ? [h("span", { class: "chip" }, "🔒 exits " + LessonLock.stats().total)] : []));
}

/* ---------- a checkpoint part ---------- */
function showType(T) {
  const tr = ST.cps[T.id];
  const card = h("div", { class: "card" }), pips = h("div", { class: "streak" }), body = h("div"), fb = h("div");
  const helpBtn = h("button", { class: "btn ghost help", onclick: () => { lockFor(T.id, "help"); } }, "I need Mr. D");
  let q = null;
  const drawPips = () => pips.replaceChildren(h("span", {}, "Right in a row:"), ...Array.from({ length: tr.need }, (_, i) => h("span", { class: "pip" + (i < tr.streak ? " on" : "") })), ...(tr.redo ? [h("span", {}, " (after an unlock: " + tr.need + " fresh ones)")] : []));
  function next() {
    q = T.make(); window.__ccQ = q; body.replaceChildren();
    if (q.t) body.append(tableEl(q.t));
    if (T.id === "seg") body.append(barsSvg(q.c, q.P));
    body.append(h("div", { class: "q" }, q.text));
    if (T.input === "num") {
      const inp = h("input", { type: "number", inputmode: "decimal", "aria-label": "Your answer" });
      const go = h("button", { class: "btn" }, "Check");
      go.onclick = () => { if (inp.value.trim() === "") return; answer(inp.value); };
      inp.addEventListener("keydown", e => { if (e.key === "Enter") go.click(); });
      body.append(h("div", { class: "row" }, inp, T.unit ? h("b", {}, T.unit) : null, go)); setTimeout(() => inp.focus(), 0);
    } else q.opts.forEach(o => body.append(h("button", { class: "opt", onclick: (e) => answer(String(o), e.currentTarget) }, String(o))));
    if (KEY) body.append(h("div", { class: "keyline" }, h("b", {}, "KEY "), String(q.answer) + (T.unit || "")));
    drawPips();
  }
  function answer(v, btn) {
    const ok = T.check(q, v); tr.att.push({ q: q.text, v, ok, at: Date.now() }); ST.answered++;
    const r = CK.grade(tr, ok);
    if (ok) {
      if (btn) btn.classList.add("ok");
      if (r === "pass") { tr.passed = true; save(); fb.replaceChildren(h("div", { class: "fb ok" }, "✔ Three in a row. This part is done.")); drawPips(); setTimeout(() => nextPart(), 900); return; }
      fb.replaceChildren(h("div", { class: "fb ok" }, "✔ Right. Here is a new one.")); save(); setTimeout(next, 700); return;
    }
    ST.misses++; if (btn) btn.classList.add("no");
    fb.replaceChildren(h("div", { class: "fb no" }, "✖ Not this time. Your streak starts over."), h("div", { class: "hintbox" }, "💡 " + q.hint + " Now try a fresh one."));
    save();
    if (r === "lock") { lockFor(T.id, "miss"); return; }
    setTimeout(next, 1600);
  }
  card.append(helpBtn, pips, body, fb);
  app.append(h("p", { class: "sub" }, T.sub), card);
  next();
}

/* ---------- the bar builder (a sim task, not a checkpoint): set each line to match the table ---------- */
function showBuild() {
  const rounds = 2;
  const wrap = h("div");
  app.append(h("div", { class: "card text" }, "Build the segmented bar graph for each table. Work out each group's percent, then slide the line in its bar to that percent. Finish two tables."), wrap);
  function round() {
    const c = pick(CTX), t = makeTable(c), P = [pct(t.n[0][0], t.R[0]), pct(t.n[1][0], t.R[1])], cur = [50, 50];
    const svgHost = h("div"), status = h("div", { class: "fb no" }, "Not yet. Each bar's line should sit at that group's percent.");
    const draw = () => { svgHost.replaceChildren(barsSvg(c, cur)); };
    const sliders = [0, 1].map(i => { const r = h("input", { type: "range", min: 0, max: 100, step: 1, value: 50, "aria-label": c.lab[i] + " line" }), v = h("div", { class: "val" }, "50%");
      r.addEventListener("input", () => { cur[i] = +r.value; v.textContent = r.value + "%"; draw(); test(); }); return h("div", { class: "sliderrow" }, h("b", {}, c.lab[i] + ": " + c.cols[0]), r, v); });
    let doneR = false;
    function test() { if (doneR) return; if (Math.abs(cur[0] - P[0]) <= 1 && Math.abs(cur[1] - P[1]) <= 1) { doneR = true; status.className = "fb ok"; status.textContent = "✔ That matches the table."; ST.build++; save(); setTimeout(() => { if (ST.build >= rounds) nextPart(); else { wrap.replaceChildren(); round(); } }, 900); } }
    const card = h("div", { class: "card" }, h("div", { class: "q" }, `Table ${ST.build + 1} of ${rounds}`), tableEl(t), svgHost, ...sliders, status,
      h("div", { class: "row" }, h("button", { class: "btn ghost", onclick: (e) => { e.currentTarget.after(h("div", { class: "hintbox" }, `💡 ${c.grp[0]}: ${t.n[0][0]} ÷ ${t.R[0]}. ${c.grp[1]}: ${t.n[1][0]} ÷ ${t.R[1]}. Times 100 each.`)); } }, "💡 Hint")));
    if (KEY) card.append(h("div", { class: "keyline" }, h("b", {}, "KEY "), `${c.lab[0]} ${P[0]}%, ${c.lab[1]} ${P[1]}%`), h("button", { class: "btn ghost", onclick: () => { ST.build = rounds; nextPart(); } }, "Skip (key)"));
    wrap.append(card); draw();
  }
  round();
}

/* ---------- flow ---------- */
function showPart() {
  if (ST.finished) return showFinal();
  chips(); app.replaceChildren(); window.scrollTo(0, 0);
  const id = ORDER[ST.part];
  if (id === "build") { app.append(h("h2", {}, `Part ${ST.part + 1} of ${ORDER.length}: Build the bars`)); return showBuild(); }
  const T = TYPES.find(x => x.id === id);
  app.append(h("h2", {}, `Part ${ST.part + 1} of ${ORDER.length}: ${T.title}`));
  if (KEY) app.append(h("div", { class: "row" }, h("button", { class: "btn ghost", onclick: () => nextPart() }, "Skip this part (key)")));
  showType(T);
  if (ST.lock) showLock();
}
function nextPart() { ST.part++; if (ST.part >= ORDER.length) ST.finished = true; save(); showPart(); }

function showFinal() {
  if (lockArmed) { LessonLock.finish(); lockArmed = false; }
  chips(); app.replaceChildren();
  const unl = Object.values(ST.cps).reduce((a, t) => a + t.unlocks, 0);
  app.append(h("div", { class: "card", style: "text-align:center" }, h("h2", {}, "All six parts done"),
    h("p", {}, "Show this screen to Mr. D, then start the practice sheet."),
    h("table", { class: "sum" },
      h("tr", {}, h("th", {}, "Student"), h("td", {}, ST.id || "(key)")),
      h("tr", {}, h("th", {}, "Time"), h("td", {}, Math.round((Date.now() - ST.t0) / 60000) + " min")),
      h("tr", {}, h("th", {}, "Questions answered"), h("td", {}, String(ST.answered))),
      h("tr", {}, h("th", {}, "Misses"), h("td", {}, String(ST.misses))),
      h("tr", {}, h("th", {}, "Times Mr. D unlocked you"), h("td", {}, String(unl))),
      h("tr", {}, h("th", {}, "Times you left the page"), h("td", {}, String(KEY ? 0 : LessonLock.stats().total))))));
}

/* ---------- checkpoint lock (3 misses, or "I need Mr. D") ---------- */
function lockFor(type, reason) { ST.lock = CK.lockInfo(type, reason, ST.part); if (!KEY) CK.mirrorSet(LESSON_ID, ST.lock, ST.id); save(); showLock(); }
function showLock() {
  if (KEY) { ST.lock = null; return; }
  const L = ST.lock, host = $("cpLockHost");
  host.replaceChildren(...CK.lockScreen(L, { head: "Mr. D needs to see you", miss: "Three misses in a row on this part.", help: "You asked for help.", body: "Raise your hand. Mr. D will look at your work with you, then type today's code.", word: "Code:", wrong: "Not the code. Hand up and wait for Mr. D.", go: "Unlock" },
    { pin: "cpPin", go: "cpGo", msg: "cpMsg" }, () => { CK.unlockTrack(ST.cps[L.type]); ST.lock = null; CK.mirrorClear(LESSON_ID); save(); $("cpLock").hidden = true; showPart(); }));
  $("cpLock").hidden = false; setTimeout(() => { const p = $("cpPin"); if (p) p.focus(); }, 0);
}

/* ---------- starting, and locked mode (shared/lock.js) ---------- */
const clk = () => MrD.bell.clock("stats");
const lockWanted = () => !KEY && !!ST.id && NOLOCK !== LessonLock.offCode() && !!clk().lockOn;
function go() { ST.started = true; save(); $("lockres").hidden = true; showPart(); }
function startCard() {
  chips(); app.replaceChildren();
  const idHost = h("div"), msg = h("p", { class: "pesMsg no" });
  const btn = h("button", { class: "btn big", id: "bBegin", disabled: "" }, "Begin →");
  app.append(h("div", { class: "card", id: "start" }, h("h2", {}, "Practice: 4.1 and 4.2"),
    h("p", {}, "Six short parts on two-way tables and association. Each part needs three right in a row. A miss gives you a hint and a fresh question. Three misses in a row, and Mr. D comes to check your work."),
    clk().lockOn && NOLOCK !== LessonLock.offCode() ? h("p", {}, h("b", {}, "This runs full screen. Leaving it is counted.")) : null,
    idHost, btn, msg));
  const ask = MrD.ids.ask(idHost, { onChange: (i) => { btn.disabled = !i.valid; msg.textContent = ""; } });
  btn.onclick = () => {
    const info = ask.get(); if (!info.valid) return; ST.id = info.id; ST.period = info.period; MrD.ids.setMe(ST.id, ST.period);
    if (!lockWanted()) return go();
    LessonLock.enter(ST.id).then(ok => { if (!ok) { msg.textContent = "Full screen did not start. This needs Chrome on your Chromebook. Tell Mr. D."; return; } lockArmed = true; go(); });
  };
}
function lockResumeCard() {
  $("lockres").hidden = false;
  $("lockresTxt").textContent = "You closed the practice page. That is lock number " + LessonLock.lockNo() + ". Mr. D needs to see you and give you a code.";
  const inp = $("lockCode"); inp.focus();
  const tryIt = () => LessonLock.resume(inp.value).then(r => { if (r === "ok") { lockArmed = true; $("lockMsg").textContent = ""; go(); } else $("lockMsg").textContent = r === "nofs" ? "Full screen did not start. Click again." : "Not the code. Hand up and wait for Mr. D."; });
  $("bUnlock").onclick = tryIt; inp.onkeydown = (e) => { if (e.key === "Enter") tryIt(); };
}

function boot() {
  if (KEY) {
    ST = fresh(); ST.started = true;
    MrD.teacherBar($("tb"), { course: "stats", lessonId: LESSON_ID, gates: [], teacher: "../teacher.html", root: "../../" });
    return showPart();
  }
  LessonLock.init({ id: LESSON_ID, root: app, onChange: () => chips() });
  ST = load() || fresh();
  const me = MrD.ids.me(); if (me && !ST.id) { ST.id = me.id; ST.period = me.period; }
  const m = CK.mirrorGet(LESSON_ID); if (m && !ST.lock) ST.lock = m;
  if (NOLOCK !== LessonLock.offCode() && clk().lockOn && LessonLock.pending()) { if (!ST.started) ST = Object.assign(fresh(), { id: ST.id }); lockResumeCard(); return; }
  setInterval(() => { if (lockArmed && !clk().lockOn) { lockArmed = false; LessonLock.finish(); chips(); } }, 5000);
  if (ST.finished) return showFinal();
  startCard();   // also after a reload: a fresh Begin click is needed for full screen, and saved progress is kept
}
window.__cc = { types: TYPES, st: () => ST, next: () => nextPart() };
boot();
</script>
