<script>
/* ============ DATA ============ */
const DATA={parts:[
{title:"Predict First",sub:"Thomson pictured the atom as a ball of positive charge with electrons stuck in it like plums in a pudding. Before you test that picture, commit to a prediction.",blocks:[
 {type:"info",html:"In 1904 <b>J. J. Thomson</b> proposed the <b>plum-pudding atom</b>: the positive charge is spread evenly through the whole atom, and the light, negative electrons are embedded in it. Five years later, <b>Hans Geiger and Ernest Marsden</b>, working in <b>Ernest Rutherford’s</b> lab, fired <b>alpha particles</b> at a thin foil of gold atoms. An alpha particle is fast, about 7,000 times heavier than an electron, and positively charged. A detector screen around the foil recorded where each one landed, measured as an angle from its original straight path."},
 {type:"widget",id:"predict",tasks:["Lock in your prediction and your reason."]}
]},
{title:"Run It",sub:"Fire alpha particles at gold atoms. Test the plum-pudding atom first, then the real foil.",blocks:[
 {type:"info",html:"The detector counts every alpha particle by the angle it lands at, in bins of 10°. <b>0°</b> means it kept going straight. <b>90°</b> means it was turned sideways. Past <b>90°</b> means it came back toward the source. Use the slider to set how many particles per second leave the source. The plum-pudding test needs 10,000 particles. The real foil needs 20,000, because the rarest events need a big sample. <b>Note:</b> the sim’s gold nucleus is made stronger than the real one so that rare events show up in seconds. Rutherford’s team counted about 1 rebound in 8,000."},
 {type:"widget",id:"foil",tasks:["Fire at least 10,000 alpha particles at the plum-pudding atom.","Fire 20,000 alpha particles at the real gold foil (fill the detector)."]}
]},
{title:"Find the Pattern",sub:"Your detector log is a table of counts. Turn it into three fractions.",blocks:[
 {type:"info",html:"<b>Straight through</b> means the first column, 0–10°. <b>Deflected</b> means 10° up to 90°. <b>Rebounded</b> means 90° and beyond. Use the counts from your own <b>real gold foil</b> run."},
 {type:"datatable"},
 {type:"num",save:"pStraight",calc:"straight",q:"What <b>percent</b> of your alpha particles went <b>straight through</b>? (0–10°, divided by the total fired, times 100.)",tol:0.3,unit:"%",why:"The first column of your table, divided by the total fired and multiplied by 100. Nearly all of them.",hint:"Look at the first column of the real-foil row in the table (0–10°). Divide that count by the total at the end of the row, then multiply by 100.",key:"about 96.7%"},
 {type:"num",save:"pDeflected",calc:"deflected",q:"What <b>percent</b> were <b>deflected</b> (10° up to 90°)?",tol:0.3,unit:"%",why:"Add the counts from 10–20° through 80–90°, divide by the total, multiply by 100. A few.",hint:"Add the eight columns from 10–20° through 80–90° in the real-foil row. Divide that sum by the total, then multiply by 100.",key:"about 3.2%"},
 {type:"num",save:"nRebound",calc:"rebound",tolRel:0.12,q:"About <b>1 in how many</b> rebounded (90° or more)? Enter the N in “1 in N”.",unit:"(1 in N)",why:"Add the counts from 90–100° through 170–180°, then divide the total fired by that sum. Very few.",hint:"Add the nine columns from 90–100° through 170–180° in the real-foil row. Divide the total fired by that sum.",key:"about 1 in 4,000 (5 rebounds in 20,000)"},
 {type:"gate",id:1,say:"Huddle 1 (at the board). Put the three numbers on the board: nearly all straight through, a few deflected, a very few rebounded. Ask: what did Thomson’s atom predict for each? Take answers until someone says it predicted all three would be ‘straight through’. Then ask what it would take to turn a heavy alpha particle around."}
]},
{title:"What It Means",sub:"Every result is a clue about what is inside the atom. Match each one, then rebuild the atom and see if the sim agrees.",blocks:[
 {type:"rows",save:"matched",q:"Match each result to what it shows about the atom.",choices:["Mostly empty space","A concentrated positive charge","A heavy, dense center"],rows:[
  {q:"Nearly all alpha particles went straight through.",ans:0,why:"If most of the atom were solid, they would hit something. They went through, so most of the atom is empty."},
  {q:"A few alpha particles were deflected through large angles.",ans:1,why:"A positive alpha particle is only pushed hard by positive charge packed into a small spot. Spread-out charge pushes weakly."},
  {q:"A very few alpha particles bounced back.",ans:2,why:"Only something much heavier than an alpha particle could turn it around, like a ball bouncing off a bowling ball."}
 ],hint:"Ask what would have to be true inside the atom for that result to happen."},
 {type:"widget",id:"nucleus",tasks:["Pack the positive charge into a nucleus.","Fire alpha particles at your nuclear atom and compare with the foil data."]},
 {type:"mcq",q:"Your nuclear atom gave counts very close to the real foil. Which change to the atom made the difference?",opts:[{t:"Packing the positive charge and most of the mass into a tiny center, with the electrons far outside it.",ok:1},{t:"Spreading the positive charge out evenly through the atom."},{t:"Adding more electrons to the pudding."},{t:"Making the whole atom bigger."}],why:"The nucleus is a tiny, dense, positive center. Most alpha particles miss it, and the few that pass close are turned hard.",hint:"Which change makes some alpha particles feel a very strong push, and most feel almost none?"}
]},
{title:"Write the Revision",sub:"A scientist changes a model by writing down why the old one failed. Do that now, with your own numbers.",blocks:[
 {type:"info",html:"Write a <b>claim</b>, <b>evidence</b> and <b>reasoning</b>. Your evidence must include <b>at least one specific count from your own run</b>, such as the number that bounced back or the number you fired. Your reasoning connects that evidence to the atom."},
 {type:"cer"}
]},
{title:"Change the Foil",sub:"Now you are the experimenter. Change the foil, predict the effect, then run it.",blocks:[
 {type:"mcq",predict:true,reason:true,reasonKey:"thickReason",note:"Now run it.",q:"You will make the gold foil <b>twice as thick</b>. How will the number of alpha particles deflected by 10° or more change?",opts:[{t:"Fewer"},{t:"About the same"},{t:"About twice as many"},{t:"Many more than twice as many"}]},
 {type:"mcq",predict:true,reason:true,reasonKey:"alReason",note:"Now run it.",q:"You will swap the gold for <b>aluminum</b>, whose nuclei carry much less positive charge (13 instead of 79). How many alpha particles will be deflected by 10° or more, compared with gold of the same thickness?",opts:[{t:"More than gold"},{t:"About the same as gold"},{t:"Far fewer than gold"}]},
 {type:"widget",id:"foil2",tasks:["Run gold at thickness 1×.","Run gold at thickness 2×.","Run aluminum at thickness 1×."]},
 {type:"num",save:"thickRatio",calc:"thickRatio",tol:0.15,q:"How many times as many alpha particles were deflected by 10° or more with the <b>2× gold foil</b> as with the <b>1× gold foil</b>? (Use the “bent 10° or more” column.)",unit:"times",why:"Twice the layers of atoms gives twice the chances for a close pass. The count roughly doubles.",hint:"Divide the 2× gold row’s “bent 10° or more” count by the 1× gold row’s.",key:"2.0"},
 {type:"num",save:"alRatio",calc:"alRatio",tolRel:0.15,q:"How many times as many alpha particles were deflected by 10° or more with <b>gold</b> as with <b>aluminum</b>, both at thickness 1×?",unit:"times",why:"Gold’s nucleus has far more positive charge, so it pushes much harder. Deflections go as the charge squared: (79 ÷ 13)² is about 37.",hint:"Divide the gold 1× row’s “bent 10° or more” count by the aluminum 1× row’s.",key:"about 37 to 40"},
 {type:"mcq",q:"Why does aluminum deflect so much less than gold?",opts:[{t:"Its nucleus has less positive charge, so it pushes an alpha particle less when one passes close.",ok:1},{t:"Aluminum atoms have no nucleus."},{t:"Aluminum atoms are solid all the way through."},{t:"Alpha particles are attracted to aluminum."}],why:"The push on an alpha particle comes from the nucleus’s positive charge. Less charge, weaker push, fewer big turns.",hint:"What in the atom pushes on the alpha particle?"}
]}
]};

/* ============ ENGINE ============ */
function h(tag,attrs,...kids){const e=document.createElement(tag);for(const k in(attrs||{})){if(k==="class")e.className=attrs[k];else if(k==="html")e.innerHTML=attrs[k];else if(k.startsWith("on"))e.addEventListener(k.slice(2),attrs[k]);else e.setAttribute(k,attrs[k])}kids.flat().forEach(c=>{if(c==null)return;e.append(c.nodeType?c:document.createTextNode(c))});return e}
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const SVGNS="http://www.w3.org/2000/svg";
function sv(tag,attrs,...kids){const e=document.createElementNS(SVGNS,tag);for(const k in(attrs||{}))e.setAttribute(k,attrs[k]);kids.flat().forEach(c=>{if(c==null)return;e.append(c.nodeType?c:document.createTextNode(c))});return e}
const KEY=MrD.isKey(),clk=()=>MrD.bell.clock("chem");
const ST={name:"",period:"",t0:0,q:0,qFirst:0,retries:0,tasks:0,tasksDone:0,partIdx:0,partsDone:[],preds:[],between:false,screen:"part",keep:{},data:(()=>{const z=()=>Array(18).fill(0);return{plum:{n:0,hist:z()},real:{n:0,hist:z()},nuc:{n:0,hist:z()},f2:[]}})(),log:[],max:0,ended:false,endIdx:0,finished:false,tk:{},pr:{i:0,band:1,up:0,down:0,clean:0}};
let inProgress=false,uid=0,LOCK_ON=false;
const app=document.getElementById("app"),chipsEl=document.getElementById("chips");
window.addEventListener("beforeunload",e=>{if(inProgress){e.preventDefault();e.returnValue=""}});
const fmtT=s=>{s=Math.floor(s);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
const DONE_TYPES=["mcq","num","rows","widget","open","gate","cloze","cer"];
/* Huddle codes come from shared/codes.js (MrD.codes.gate), so the key view, the teacher page and the student page always agree.
   They are asked for only on weekdays 7:00 AM to 3:00 PM (shared/bell.js). */
const LESSON_ID="rutherford-gold-foil";
/* Locked mode (see ../../shared/lock.js): on only during chemistry's period, never in #key, and off with #nolock=<code> from the lock desk. */
LessonLock.init({id:LESSON_ID,root:document.querySelector(".wrap"),onChange:()=>chips()});
const NOLOCK=(/nolock=(\d+)/.exec(location.hash)||[])[1]===LessonLock.offCode();
const lockSnap=()=>JSON.parse(JSON.stringify(ST));
const lockTxt=()=>{if(!LOCK_ON)return"";const L=LessonLock.stats();return` · left the lesson ${L.total}× · away ${fmtT(L.awaySec)}`};
const g=n=>(Math.round(n*100)/100).toString();

/* ---------- gold-foil helpers ---------- */
const FM=FoilModel,NB=FM.BINS,binL=i=>`${i*10}–${i*10+10}°`,grpOf=i=>i===0?"s":i<=8?"d":"r";
const GCOL={s:"#7fb3d9",d:"#f0a43a",r:"#e5484d"},GBG={s:"rgba(127,179,217,.25)",d:"rgba(240,164,58,.25)",r:"rgba(229,72,77,.25)"};
const histSum=(hh,k)=>FM.sum(hh,k==="s"?"straight":k==="d"?"deflected":"rebound");
const total=hh=>hh.reduce((a,b)=>a+b,0),num=n=>n.toLocaleString("en-US");
const rotOf=()=>{if(!ST.keep.rot)ST.keep.rot=[Math.random(),Math.random()];return ST.keep.rot};
/* A stream continues where its counter left off, so a run that is paused and started again never repeats a particle. */
const streamOf=(n,shift)=>{const r=rotOf();return{i:n,r1:(r[0]+(shift||0))%1,r2:(r[1]+(shift||0))%1}};
function binTable(rows){
  const head=h("tr",{},h("th",{},"Angle"),[...Array(NB).keys()].map(i=>h("th",{style:`background:${GBG[grpOf(i)]}`},binL(i))),h("th",{},"Total"));
  const body=rows.map(r=>h("tr",{},h("th",{style:"text-align:left;white-space:nowrap"},r.label),r.hist.map(c=>h("td",{style:"text-align:right"},num(c))),h("td",{style:"text-align:right;font-weight:700"},num(total(r.hist)))));
  return h("div",{style:"overflow-x:auto"},h("table",{class:"wtbl bt",style:"white-space:nowrap"},h("thead",{},head),h("tbody",{},body)));
}
/* log-scale bar chart on a canvas; series = [{hist,color?}], one bar per 10° bin, side by side when there are two */
function drawHist(cv,series){
  const c=cv.getContext("2d"),W=cv.width,H=cv.height,L=62,B=48,T=22,pw=W-L-10,ph=H-B-T;
  c.clearRect(0,0,W,H);c.font="15px system-ui,sans-serif";
  const mx=Math.max(1,...series.flatMap(s=>s.hist)),lg=v=>Math.log10(v+1)/Math.log10(mx+1);
  c.strokeStyle="rgba(150,150,150,.5)";c.fillStyle="rgba(150,150,150,.9)";c.textAlign="right";
  for(const v of [0,1,10,100,1000,10000]){if(v>mx)break;const y=T+ph*(1-lg(v));c.beginPath();c.moveTo(L,y);c.lineTo(L+pw,y);c.stroke();c.fillText(num(v),L-5,y+5)}
  const bw=pw/NB;
  for(let i=0;i<NB;i++)series.forEach((s,k)=>{
    const v=s.hist[i],hh=ph*lg(v),w=(bw-4)/series.length,x=L+i*bw+2+k*w;
    c.fillStyle=series.length>1?(k?"#e5484d":"#7fb3d9"):GCOL[grpOf(i)];
    if(v>0){c.fillRect(x,T+ph-hh,w,hh);c.fillStyle="rgba(150,150,150,.95)";c.textAlign="center";c.font="13px system-ui,sans-serif";if(series.length===1)c.fillText(num(v),x+w/2,T+ph-hh-4);c.font="15px system-ui,sans-serif"}
  });
  c.fillStyle="rgba(150,150,150,.95)";c.textAlign="center";
  for(let i=0;i<=NB;i+=2)c.fillText(i*10,L+i*bw,H-B+18);
  c.fillText("Angle from the original path (°)  ·  bar height is a log scale",L+pw/2,H-6);
}
const circ=(c,x,y,r)=>{c.beginPath();c.arc(x,y,r,0,7);c.fill()};
function atomPic(c,x,y,r,m){
  if(m==="plum"){c.fillStyle="rgba(229,72,77,.5)";circ(c,x,y,r);c.fillStyle="#5aa9ff";[[.4,-.3],[-.5,.1],[.1,.5],[.3,.2],[-.2,-.5],[-.4,-.35]].forEach(p=>circ(c,x+p[0]*r,y+p[1]*r,2.2))}
  else{c.fillStyle="rgba(90,169,255,.16)";circ(c,x,y,r);c.fillStyle="#e5484d";circ(c,x,y,2.4);c.fillStyle="#5aa9ff";[[.92,0],[-.65,.65],[-.3,-.88]].forEach(p=>circ(c,x+p[0]*r,y+p[1]*r,2))}
}

/* ---------- widgets ---------- */
const WIDGET={};

WIDGET.predict=(tick)=>{
  const ZONES=[["A","0–10°","almost straight on"],["B","10–45°",""],["C","45–90°","sideways"],["D","90–135°","back toward the source"],["E","135–180°","almost straight back"]];
  const svg=sv("svg",{class:"scene",viewBox:"0 0 520 190",role:"img","aria-label":"A plum-pudding atom, and an alpha beam aimed at a foil with the detector divided into five angle zones"});
  svg.append(sv("circle",{cx:100,cy:95,r:78,fill:"rgba(229,72,77,.22)",stroke:"rgba(229,72,77,.8)","stroke-width":2}));
  [[60,60],[120,50],[145,100],[85,115],[110,140],[55,100],[130,75],[75,80]].forEach(p=>svg.append(sv("circle",{cx:p[0],cy:p[1],r:5,fill:"#5aa9ff",stroke:"rgba(0,0,0,.4)"})));
  [[90,70],[105,100],[70,130],[125,120],[100,60]].forEach(p=>svg.append(sv("text",{x:p[0],y:p[1],"font-size":14,fill:"rgba(229,72,77,.9)","text-anchor":"middle"},"+")));
  svg.append(sv("text",{x:100,y:15,"text-anchor":"middle","font-size":11,fill:"currentColor","font-weight":700},"Plum-pudding gold atom"));
  svg.append(sv("text",{x:100,y:184,"text-anchor":"middle","font-size":10.5,fill:"currentColor","fill-opacity":.8},"+ spread out · electrons embedded"));
  const cx=420,cy=100,R=78;
  svg.append(sv("line",{x1:250,y1:cy,x2:cx-6,y2:cy,stroke:"#f0a43a","stroke-width":2.5,"stroke-dasharray":"6 4"}));
  svg.append(sv("text",{x:300,y:cy-10,"text-anchor":"middle","font-size":11,fill:"#f0a43a"},"alpha beam →"));
  svg.append(sv("rect",{x:cx-5,y:cy-55,width:10,height:110,fill:"#e0b030",opacity:.85}));
  svg.append(sv("text",{x:cx,y:cy+72,"text-anchor":"middle","font-size":10.5,fill:"currentColor","fill-opacity":.8},"gold foil"));
  [10,45,90,135].forEach(a=>[1,-1].forEach(sg=>{const r=a*Math.PI/180;svg.append(sv("line",{x1:cx,y1:cy,x2:cx+R*Math.cos(r),y2:cy-sg*R*Math.sin(r),stroke:"currentColor","stroke-opacity":.35,"stroke-dasharray":"3 3"}))}));
  svg.append(sv("path",{d:`M ${cx+R} ${cy} A ${R} ${R} 0 0 0 ${cx-R} ${cy}`,fill:"none",stroke:"currentColor","stroke-opacity":.3}));
  svg.append(sv("path",{d:`M ${cx+R} ${cy} A ${R} ${R} 0 0 1 ${cx-R} ${cy}`,fill:"none",stroke:"currentColor","stroke-opacity":.3}));
  [5,27,67,112,157].forEach((a,i)=>{const r=a*Math.PI/180;svg.append(sv("text",{x:cx+(R-16)*Math.cos(r),y:cy-(R-16)*Math.sin(r)+4,"text-anchor":"middle","font-size":13,"font-weight":700,fill:"currentColor"},ZONES[i][0]))});
  const ins=ZONES.map(z=>h("input",{type:"number",min:0,max:100,step:1,value:0,inputmode:"numeric","aria-label":"Alpha particles in zone "+z[0]+" ("+z[1]+")",style:"width:84px",oninput:upd}));
  const left=h("b",{},"100"),ta=h("textarea",{"aria-label":"Why do you think so?",placeholder:"I think they will land there because ...",style:"min-height:70px",oninput:upd});
  const btn=h("button",{class:"btn",disabled:"",onclick:lock},"Lock in my prediction"),fb=feedback();
  function used(){return ins.reduce((a,i)=>a+(Math.max(0,Math.floor(+i.value||0))),0)}
  function upd(){const u=used();left.textContent=100-u;left.style.color=u===100?"var(--ok)":u>100?"var(--bad)":"inherit";btn.disabled=!(u===100&&ta.value.trim().length>=10)}
  function lock(){
    const z=ins.map(i=>Math.max(0,Math.floor(+i.value||0)));
    ST.keep.predZones=z;ST.keep.predReason=ta.value.trim();
    ST.preds.push({q:"Where will 100 alpha particles land? (plum-pudding atom)",choice:ZONES.map((q,i)=>q[0]+" "+q[1]+": "+z[i]).join(" · ")});
    ins.forEach(i=>i.disabled=true);ta.disabled=true;btn.disabled=true;show(fb,true,"🔒 Locked in. Now test it.");tick(0);
  }

  const note=html=>card.append(h("div",{class:"keyline",html}));
  if(b.type==="mcq"){
    if(b.predict)return note("<b>KEY</b> Prediction: any answer is accepted. It is saved to the student’s notes and the stamp summary. Expected result: "+(/twice as thick/.test(b.q)?"about twice as many deflections.":"far fewer than gold (about 1/37)."));
    const ok=b.opts.find(o=>o.ok);note(`<b>KEY ✔</b> ${ok.t}<br><i>${b.why}</i>`);
    card.querySelectorAll(".opts label").forEach(l=>{if(l.textContent.trim()===strip(ok.t).trim())l.style.outline="2px solid var(--ok)"});
  }
  if(b.type==="num")note(`<b>KEY ✔</b> ${b.calc?"Computed from the student’s own data: "+b.key:[].concat(b.ans).join(" or ")} ${b.unit||""} (accepted within ${b.tolRel?"±"+Math.round(b.tolRel*100)+"%":"±"+b.tol})<br><i>${b.why}</i>`);
  if(b.type==="rows")note("<b>KEY ✔</b> "+b.rows.map(r=>`${strip(r.q)} → <b>${b.choices[r.ans]}</b>`).join("<br>"));
  if(b.type==="cloze")note("<b>KEY ✔</b> "+b.items.map(it=>it.t.replace("___","<b>"+it.a+"</b>")).join("<br>"));
  if(b.type==="widget")note(`<b>KEY</b> ${WIDGET_KEY[b.id]}`);
  if(b.type==="datatable")note("<b>KEY</b> Table of the student’s own counts. It fills from the Run It part.");
  if(b.type==="cer")note("<b>KEY</b> Required: the claim starts with “The plum-pudding model fails because”. A strong answer says the plum pudding predicts nearly every alpha particle goes almost straight, and none turned back. Evidence cites a specific count from the student’s own table (for example, 3 of 10,000 rebounded, or 330 deflected 10° or more). Reasoning says only a tiny, dense, positive center can turn a heavy alpha particle around, and spread-out charge cannot. The evidence is checked for a number that matches the student’s own counts.");
  if(b.type==="open")note("<b>KEY</b> Open response, checked for length only. Good answers say the model changed because the data showed rebounds the plum pudding could not produce, and name an open question (what the electrons are doing, why they do not fall into the nucleus, what the nucleus is made of).");
  if(b.type==="gate")note(`<b>KEY</b> Huddle ${b.id}. Today’s code: <b>${MrD.codes.gate(LESSON_ID,"h"+b.id)}</b>. Students see this stop only on weekdays 7:00 AM to 3:00 PM.<br>${b.say}`);
}
