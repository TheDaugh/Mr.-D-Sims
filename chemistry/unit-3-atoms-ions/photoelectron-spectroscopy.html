<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photoelectron Spectroscopy · Mr. D</title>
<meta name="description" content="Shine light on atoms, read the spectrum of the electrons that come out, and match each spectrum to an element.">
<link rel="stylesheet" href="../shared/lab.css">
<style>
  .wrap{max-width:none;padding-inline:clamp(12px,3vw,40px)}
  .sub{color:var(--muted);margin:0 0 12px;max-width:72ch}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px}
  .chip{padding:2px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:.85rem;color:var(--muted)}
  .chip.on{border-color:var(--accent);color:var(--accent);font-weight:700}
  button.chip{cursor:pointer;font:inherit;font-size:.85rem}
  .chip.locked{opacity:.5}
  .chip.done{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
  .card{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 12px;background:var(--panel)}
  .row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
  .col{flex:1 1 380px;min-width:0}
  .btn{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .ghost{background:var(--panel);color:var(--ink);border-color:var(--line)}
  .opt{display:block;width:100%;text-align:left;margin:4px 0;padding:8px 10px}
  .opt.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
  .opt.no{border-color:var(--bad,#b3261e);color:var(--bad,#b3261e)}

  .tag{display:inline-block;padding:0 6px;border-radius:4px;background:var(--panel);border:1px solid var(--line);font-size:.8rem;color:var(--muted)}
  .hint{color:var(--muted);font-size:.9rem}
  .axis{font:12px system-ui,sans-serif;fill:var(--muted)}
  .peak{fill:var(--accent);cursor:pointer}
  .peak:hover{opacity:.8}
  .ghostbar{fill:none;stroke:var(--warn,#c47a00);stroke-dasharray:4 3;stroke-width:2}
  .periodic{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px;margin:8px 0}
  .periodic button{padding:6px 2px;font-size:.85rem;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px}
  .periodic button:disabled{color:#9aa3ab;background:#f1f3f5;cursor:not-allowed}
  .periodic button.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
  .periodic .p2{background:#e6f1fb}
  .periodic .p3{background:#f3ecfa}
  .draw{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
  .draw .slot{border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center}
  .bar{margin:0 auto;width:34px;background:var(--accent);border-radius:3px 3px 0 0}
  .keyonly{display:none}
  body.keymode .keyonly{display:block}
  .keyonly{margin-top:10px;padding:10px;border:2px dashed var(--warn,#c47a00);border-radius:8px;background:#fffaf0;color:#1b1b1b;font-size:.9rem}
  .keyonly h2,.keyonly h3,.keyonly b,.keyonly p,.keyonly td,.keyonly th{color:#1b1b1b}
  .keyonly .a{color:#1b1b1b}
  .keyonly .a{background:#fde68a;padding:0 3px;border-radius:3px;font-weight:700}
  table.k{border-collapse:collapse;width:100%;font-size:.86rem;margin:6px 0}
  table.k td,table.k th{border:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
  .locked{opacity:.5;pointer-events:none}
  input.num{width:9ch;font-size:1.1rem;padding:6px}
  input.txt{width:100%;max-width:60ch;font-size:1rem;padding:6px}
</style>
<script src="../../shared/config.js"></script>
<script src="../../shared/bell.js"></script>
<script src="../../shared/codes.js"></script>

<body>
<div class="wrap">
  <a href="../index.html" class="hint">&larr; Chemistry</a>
  <h1>Photoelectron Spectroscopy</h1>
  <p class="sub">Shine light on an atom. The electrons that come out tell you how hard each one was held. Each spectrum is one element's fingerprint.</p>
  <nav id="chips" class="chips" aria-label="Lesson steps"></nav>
  <main id="app" aria-live="polite"></main>
  <section id="keypanel" class="keyonly" hidden></section>
</div>

<script>
/* ============ setup ============ */
const KEY = MrD.isKey();
const LESSON_ID = "photoelectron-spectroscopy";
const NOLOCK = (/nolock=(\d+)/.exec(location.hash) || [])[1] === LessonLock.offCode();
const LOCK_ON = !KEY && !NOLOCK;
if (KEY) document.body.classList.add("keymode");

const D = PESData, PR = PESPractice;
const SIM = D.simElements();                                 // [1,2,3,10,12,18]
const SYM = ["H","He","Li","Be","B","C","N","O","F","Ne","Na","Mg","Al","Si","P","S","Cl","Ar","K","Ca"];
const NM = PR.NAME;
const LOG = Math.log10, LO = 0.4, HI = 400;                  // MJ/mol range of the beam and the axis
const EV = D.EV_TO_MJ;

/* ID-SWAP: students type a student ID (never a name). Pending the shared ID system; stored in S.first. */
const ST = { id: "", period: "", screen: "start", band: { warm: 1, p1: 1, p2: 1, p3: 1, p4: 1, practice: 1 },
  streak: 0, miss: 0, b3done: 0, log: [], notes: {}, drawn: null, p2ok: 0, h1ok: false, h2ok: false, startAt: Date.now() };
const QUICK = 6;                                             // quick band-1 items at the start of each part

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const k in (attrs || {})) {
    const v = attrs[k];
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "html") el.innerHTML = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "disabled") el.disabled = !!v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  kids.flat().forEach(c => { if (c === null || c === undefined || c === false) return; el.append(c.nodeType ? c : document.createTextNode(String(c))); });
  return el;
}
const $app = () => document.getElementById("app");
const save = () => { try { sessionStorage.setItem("pes.state", JSON.stringify({ band: ST.band, log: ST.log.slice(-200), notes: ST.notes })); } catch (e) {} };
function logResp(kind, text, extra) {
  const row = { kind, text, extra: extra || null, at: Date.now() };
  ST.log.push(row); ST.notes[kind + ":" + ST.log.length] = row; save();
  try {
    const day = MrD.bell.dayKey(), all = JSON.parse(localStorage.getItem("pes.responses") || "[]").filter(x => !(x.id === ST.id && x.day === day));
    all.push({ id: ST.id, period: ST.period, day, ...row }); localStorage.setItem("pes.responses", JSON.stringify(all));
  } catch (e) {}
}
function fb(el, ok, text) { el.className = "fb show " + (ok ? "ok" : "no"); el.textContent = text; }

/* ============ the spectrum (binding energy on a log axis, high on the left) ============ */
const xOf = (MJ, L, W) => L + (LOG(HI) - LOG(MJ)) / (LOG(HI) - LOG(LO)) * W;
function spectrumSVG(Z, o = {}) {
  const W = 600, H = 262, L = 56, T = 14, PW = W - L - 16, PH = H - T - 56;
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", (NM[Z] || SYM[Z - 1]) + " photoelectron spectrum");
  svg.style.width = "100%"; svg.style.maxWidth = "640px";
  const NS = "http://www.w3.org/2000/svg";
  const mk = (t, a, txt) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); if (txt !== undefined) e.textContent = txt; svg.append(e); return e; };
  const base = T + PH;
  mk("line", { x1: L, x2: L + PW, y1: base, y2: base, stroke: "var(--line)" });
  mk("line", { x1: L, x2: L, y1: T, y2: base, stroke: "var(--line)" });
  [0.5, 1, 2, 5, 10, 20, 50, 100, 200, 400].forEach(v => {
    const x = xOf(v, L, PW);
    mk("line", { x1: x, x2: x, y1: base, y2: base + 4, stroke: "var(--line)" });
    mk("text", { x: x, y: base + 16, "text-anchor": "middle", class: "axis" }, v);
  });
  for (let c = 0; c <= 6; c += 2) {
    const y = T + PH - c / 6 * PH;
    mk("text", { x: L - 8, y: y + 4, "text-anchor": "end", class: "axis" }, c);
  }
  mk("text", { x: L + PW / 2, y: H - 8, "text-anchor": "middle", class: "axis" }, "binding energy, MJ/mol (log scale; hardest to knock loose on the left)");
  mk("text", { x: 14, y: T + PH / 2, "text-anchor": "middle", class: "axis", transform: `rotate(-90 14 ${T + PH / 2})` }, "electrons");
  const spec = D.spectrum(Z) || [];
  const beam = o.photon === undefined ? Infinity : o.photon;
  if (o.overlay) o.overlay.forEach(g => {
    const x = xOf(g.MJ, L, PW), hgt = g.count / 6 * PH;
    mk("rect", { x: x - 6, y: base - hgt, width: 12, height: hgt, class: "ghostbar" });
  });
  spec.forEach(p => {
    if (p.MJ > beam) return;
    const x = xOf(p.MJ, L, PW), hgt = p.count / 6 * PH;
    const r = mk("rect", { x: x - 5, y: base - hgt, width: 10, height: hgt, class: "peak", tabindex: 0, "data-sub": p.sub });
    r.addEventListener("click", () => o.onPeak && o.onPeak(p, Z));
    r.addEventListener("keydown", e => { if (e.key === "Enter" && o.onPeak) o.onPeak(p, Z); });
    if (o.tags) mk("text", { x: x, y: base - hgt - 4, "text-anchor": "middle", class: "axis" }, p.sub + " · " + p.count);
  });
  return svg;
}
function peakInfo(p, Z) {
  return `${NM[Z] || SYM[Z - 1]}: the ${p.sub} peak. ${p.count} electrons. Binding energy ${p.MJ.toFixed(2)} MJ/mol (${p.eV.toFixed(p.eV < 100 ? 2 : 0)} eV).`;
}
function visiblePeaks(Z, photon) { return (D.spectrum(Z) || []).filter(p => p.MJ <= photon).length; }

/* the atom: nucleus and rings, drawn in code */
function atomSVG(Z) {
  const NS = "http://www.w3.org/2000/svg", W = 200, H = 200, cx = 100, cy = 100;
  const svg = document.createElementNS(NS, "svg"); svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.style.width = "180px";
  const add = (t, a, txt) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); if (txt !== undefined) e.textContent = txt; svg.append(e); };
  const shells = {};
  D.occupied(Z).forEach(o => { const n = +o.sub[0]; shells[n] = (shells[n] || 0) + o.count; });
  Object.keys(shells).forEach(n => {
    const r = 22 + (+n - 1) * 28;
    add("circle", { cx, cy, r, fill: "none", stroke: "var(--line)" });
    const k = shells[n];
    for (let i = 0; i < k; i++) { const a = 2 * Math.PI * i / k - Math.PI / 2; add("circle", { cx: cx + r * Math.cos(a), cy: cy + r * Math.sin(a), r: 4, fill: "var(--accent)" }); }
  });
  add("circle", { cx, cy, r: 14, fill: "var(--warn,#c47a00)" });
  add("text", { x: cx, y: cy + 5, "text-anchor": "middle", fill: "#fff", "font-size": 13, "font-weight": 700 }, SYM[Z - 1]);
  return svg;
}

/* ============ items: one renderer for every practice and check question ============ */
function itemView(item, after) {
  const wrap = h("div", { class: "card" });
  const tagLine = item.tags && item.tagList ? h("div", { class: "hint" }, "Subshells on this atom: ", h("span", { class: "tag" }, item.tagList)) : null;
  wrap.append(h("p", { html: item.q }), ...[tagLine].filter(Boolean));
  const fbEl = h("div", { class: "fb", "aria-live": "polite" });
  let hints = 0, locked = false;
  const hintBtn = h("button", { class: "ghost", onclick: () => { hints++; fb(fbEl, false, "Hint: " + item.hint); } }, "Hint");
  const finish = (ok, first) => {
    locked = true;
    const b = ST.band.practice;
    if (ok && first && hints === 0) ST.streak++; else if (!ok) { ST.streak = 0; ST.miss++; } else ST.streak = 0;
    if (ok) { ST.miss = 0; } if (item.band === 3 && ok) ST.b3done++;
    logResp("item:" + item.skill, (ok ? "right" : "miss") + " band " + item.band, { q: item.q });
    after && after(ok);
  };
  if (item.type === "num") {
    let tries = 0;
    const inp = h("input", { class: "num", inputmode: "decimal", "aria-label": "Your answer", type: "text" });
    const go = h("button", { class: "btn", onclick: () => {
      if (locked) return; tries++;
      const v = Number(inp.value.trim());
      if (inp.value.trim() !== "" && Number(v) === item.ans) { fb(fbEl, true, "✔ " + item.why); finish(true, tries === 1); }
      else { fb(fbEl, false, "Not yet. " + (tries >= 2 ? "Hint: " + item.hint : "Try once more.")); if (tries === 1) hintBtn.disabled = false; if (tries >= 2) { finish(false, false); } }
    } }, "Check");
    inp.addEventListener("keydown", e => { if (e.key === "Enter") go.click(); });
    wrap.append(h("p", {}, inp, " ", item.unit ? h("span", { class: "hint" }, item.unit) : null), h("p", {}, go, " ", hintBtn), fbEl);
  } else {
    let tries = 0;
    const row = h("div");
    item.opts.forEach((t, i) => {
      const b = h("button", { class: "opt ghost", onclick: () => {
        if (locked) return; tries++;
        if (i === item.ans) { b.classList.add("ok"); fb(fbEl, true, "✔ " + item.why); finish(true, tries === 1); }
        else { b.classList.add("no"); b.disabled = true; fb(fbEl, false, "Not that one. " + (tries >= 2 ? "Hint: " + item.hint : "Pick again.")); if (tries >= 2) finish(false, false); }
      } }, t);
      row.append(b);
    });
    wrap.append(row, h("p", {}, hintBtn), fbEl);
  }
  return wrap;
}

/* the ladder: band moves with success. Two right in a row with no hint goes up; two misses goes down. */
function ladder(part, ok) {
  if (ok) { if (ST.streak >= 2 && ST.band[part] < 3) { ST.band[part]++; ST.streak = 0; } }
  else if (ST.miss >= 2 && ST.band[part] > 1) { ST.band[part]--; ST.miss = 0; }
  save();
}
function quickItems(part, label, done) {
  let n = 0, seed = ST.id.length * 97 + ST.period.length + 13;
  const box = h("section", { class: "card" }, h("h3", {}, label), h("p", { class: "hint" }, "Quick items. Answer each one, then the task below."));
  const next = () => {
    if (n >= QUICK) { box.append(h("p", {}, h("button", { class: "btn", onclick: done }, "On to the task"))); return; }
    const it = PR.spec(n, 1, seed + part.length);            // band 1 at the start of every part
    n++;
    const cont = h("button", { class: "ghost", hidden: true, onclick: () => { cont.remove(); next(); } }, "Next");
    box.append(itemView(it, ok => { ladder(part, ok); cont.hidden = false; }), cont);
  };
  next();
  return box;
}

/* ============ screens ============ */
const SCREENS = [
  ["start", "Start"], ["warm", "Warm-up"], ["h1", "Huddle 1"], ["p1", "Part 1"], ["p2", "Part 2"],
  ["h2", "Huddle 2"], ["p3", "Part 3"], ["p4", "Part 4"], ["exit", "Exit"], ["practice", "Practice"]
];
/* Chips jump back to any section already reached. Going forward still happens through each section's own Continue. */
function chips() {
  const nav = document.getElementById("chips"); nav.replaceChildren();
  const cur = SCREENS.findIndex(s => s[0] === ST.screen);
  ST.reached = Math.max(ST.reached || 0, cur);
  SCREENS.forEach(([id, label], i) => {
    const on = i === cur, done = cur > i, open = i <= ST.reached;
    const cls = "chip " + (on ? "on" : "") + (done ? " done" : "");
    nav.append(open && !on
      ? h("button", { class: cls, type: "button", onclick: () => go(id) }, (i + 1) + " " + label)
      : h("span", { class: cls + (open ? "" : " locked") }, (i + 1) + " " + label));
  });
}
function go(screen) { ST.screen = screen; save(); chips(); window.scrollTo(0, 0); render(); }
const next = (to) => () => go(to);

function render() {
  const app = $app(); app.replaceChildren();
  ({ start, warm, h1, p1, p2, h2, p3, p4, exit: exitScreen, practice }[ST.screen] || start)(app);
  if (KEY) keyPanel();
}

/* Start */
function start(app) {
  const id = h("input", { class: "txt", id: "sid", "aria-label": "Student ID", placeholder: "Your student ID", value: ST.id });
  const period = h("input", { class: "num", id: "per", "aria-label": "Period", placeholder: "period", value: ST.period });
  const go_ = h("button", { class: "btn", onclick: () => {
    const v = id.value.trim();
    if (!v) { fb(err, false, "Type your student ID first."); return; }
    ST.id = v; ST.period = period.value.trim(); save();
    if (LOCK_ON) { try { LessonLock.init({ id: LESSON_ID, root: document.querySelector(".wrap"), onChange: chips }); LessonLock.enter(ST.id); } catch (e) {} }
    go("warm");
  } }, "Start");
  const err = h("div", { class: "fb" });
  app.append(
    h("section", { class: "card" },
      h("h2", {}, "Today you will"),
      h("p", {}, "I can read a photoelectron spectrum and match it to an element."),
      h("p", {}, "I can say what the peaks' positions and heights tell me."),
      h("p", {}, "I can sketch the spectrum for an atom's configuration."),
      h("p", { class: "hint" }, "Up next: a short warm-up, then the first huddle with Mr. D."),
      h("p", {}, id, " ", period, " ", go_), err),
    h("section", { class: "card hint" }, "This lesson is locked to this window while you work. Leaving it is logged for your teacher.")
  );
  if (KEY) go_.textContent = "Open (teacher key)";
  if (ST.id) { chips(); }
}

/* Warm-up: 3 easy items with pictures, band 1 */
function warm(app) {
  const items = [
    { Z: 10, q: "Neon is 1s² 2s² 2p⁶. How many electrons are in its 2p subshell?", ans: 6, unit: "electrons", hint: "The 6 after the p is the count.", why: "2p⁶ means six electrons in the 2p subshell." },
    { Z: 11, q: "Sodium is 1s² 2s² 2p⁶ 3s¹. How many valence electrons does it have (the ones in its outer shell)?", ans: 1, unit: "electron", hint: "Count only the electrons in the highest shell, 3s.", why: "Only the 3s¹ electron is in the outer shell: one valence electron." },
    { Z: 3, q: "Lithium has two electrons: one in 1s, close to the nucleus, and one in 2s, farther out. Which one is held harder?", opts: ["The 2s electron, farther out", "The 1s electron, closer to the nucleus"], ans: 1, hint: "Closer to a positive nucleus means a stronger pull.", why: "The closer electron feels a stronger pull from the nucleus, so it is held harder." },
  ];
  const box = h("section", { class: "card" }, h("h2", {}, "Warm-up"),
    h("p", { class: "hint" }, "Three easy items from earlier work. The picture shows the atom: rings are shells, dots are electrons."));
  app.append(box);
  let k = 0;
  const showNext = () => {
    if (k >= items.length) { box.append(h("p", {}, h("button", { class: "btn", onclick: next("h1") }, "Continue to Huddle 1"))); return; }
    const it = items[k++];
    box.append(h("div", { class: "row" }, h("div", { class: "col" }, atomSVG(it.Z))));
    const cont = h("button", { class: "ghost", hidden: true, onclick: () => { cont.remove(); showNext(); } }, "Next");
    const reveal = () => { cont.hidden = false; };
    const view = it.opts
      ? itemView({ type: "mcq", q: it.q, opts: it.opts, ans: it.ans, hint: it.hint, why: it.why, band: 1, skill: "chem.pes.warm" }, reveal)
      : itemView({ type: "num", q: it.q, ans: it.ans, unit: it.unit, hint: it.hint, why: it.why, band: 1, skill: "chem.pes.warm" }, reveal);
    box.append(view, cont);
  };
  showNext();
}

/* Huddle 1: Mr. D talks; typed definitions; mystery spectrum hook */
function h1(app) {
  const defs = [
    { t: "A photoelectron is an [[electron]] that light knocks out of an atom.", ans: ["electron", "electrons"] },
    { t: "Binding energy is how [[hard]] it is to knock an electron loose.", ans: ["hard", "difficult"] },
    { t: "A peak is one [[subshell]] on the spectrum.", ans: ["subshell", "sub-shell", "subshells"] },
  ];
  const card = h("section", { class: "card" }, h("h2", {}, "Huddle 1 · Mr. D at the front"),
    h("p", { class: "hint" }, "Mr. D is talking. Write the blanks as you hear them."));
  const fbEl = h("div", { class: "fb" });
  const inputs = defs.map(d => {
    const parts = d.t.split(/\[\[|\]\]/);
    const inp = h("input", { class: "txt", "aria-label": "Blank" });
    card.append(h("p", {}, parts[0], inp, parts[2]));
    return { inp, ans: d.ans };
  });
  const huddleCode = h("input", { class: "num", "aria-label": "Huddle 1 code", placeholder: "code" });
  const codeFb = h("div", { class: "fb" });
  const checkBtn = h("button", { class: "btn", onclick: () => {
    const okAll = inputs.every(x => x.ans.includes(x.inp.value.trim().toLowerCase()));
    if (!okAll) { fb(fbEl, false, "Check the blanks. One word each."); return; }
    inputs.forEach(x => logResp("huddle1:blank", x.inp.value.trim()));
    fb(fbEl, true, "✔ Saved.");
    ST.h1ok = true; save();
  } }, "Save my blanks");
  card.append(h("p", {}, checkBtn), fbEl);
  card.append(h("h3", {}, "Worked example (Mr. D does this live)"),
    h("p", {}, "Light with energy 2.1 MJ/mol hits lithium. Lithium's 2s binding energy is 0.52 MJ/mol. The 2s electron is knocked out, because the light has more energy than the ", h("input", { class: "txt", "aria-label": "Blank", id: "wex" }), " of that electron."));
  card.append(h("h3", {}, "Mystery spectrum (hold your guess)"),
    h("p", { class: "hint" }, "No labels. Count the peaks first. You will name this element in Part 2."),
    spectrumSVG(12, { tags: false }));
  const codeOK = KEY || !MrD.bell.gatesOn();
  const cont = h("button", { class: "btn", disabled: !codeOK, onclick: next("p1") }, "Continue to Part 1");
  if (!codeOK) {
    card.append(h("p", {}, "Teacher code: ", huddleCode, " ", h("button", { class: "ghost", onclick: () => {

/* Part 3: Model A, then the draw tool */
function p3(app) {
  const box = h("section", { class: "card" }, h("h2", {}, "Part 3 · Does this model fit?"));
  box.append(h("p", {}, "Model A says: ", h("i", {}, "“All electrons in the same shell are held equally hard, so each shell gives one peak.”")));
  // Model A on neon: the K shell (1s) is one peak; the L shell is one peak placed at its electron-weighted average.
  const ne = D.spectrum(10);
  const L = ne.filter(o => o.sub[0] === "2");
  const Lmj = L.reduce((a, o) => a + o.MJ * o.count, 0) / L.reduce((a, o) => a + o.count, 0);
  const overlay = [{ MJ: ne[0].MJ, count: 2 }, { MJ: Lmj, count: 8 }];
  box.append(h("p", { class: "hint" }, "Dashed bars: what Model A predicts for neon (K shell 2 electrons, L shell 8 electrons). Solid bars: the real spectrum."));
  box.append(spectrumSVG(10, { photon: HI, tags: true, overlay }));
  const fitQ = [
    { t: "Fits: the real spectrum has one peak per shell.", ok: false },
    { t: "Does not fit: neon has three peaks, so the L shell is not one peak.", ok: true },
  ];
  const out = h("div", { class: "fb" });
  fitQ.forEach((f, i) => box.append(h("button", { class: "opt ghost", onclick: () => {
    logResp("p3:fit", String.fromCharCode(65 + i));
    if (f.ok) fb(out, true, "✔ Right. The 2s and 2p bars are at different heights and different positions.");
    else fb(out, false, "Look again: count the bars in the real spectrum (solid). How many does Model A give?");
  } }, String.fromCharCode(65 + i) + ". " + f.t)));
  box.append(out);
  const rev = h("input", { class: "txt", "aria-label": "One-sentence revision", placeholder: "One sentence: how would you fix Model A?" });
  box.append(h("p", {}, rev, " ", h("button", { class: "ghost", onclick: () => {
    if (rev.value.trim().length < 15) return fb(out, false, "One full sentence, please.");
    logResp("p3:revision", rev.value.trim()); fb(out, true, "✔ Saved to your notes.");
  } }, "Save")));
  box.append(h("h3", {}, "Draw tool: sketch neon's spectrum"),
    h("p", { class: "hint" }, "Set the three bars in order of binding energy, left to right: 1s, 2s, 2p. Height is the number of electrons (0 to 8)."));
  const slots = ["1s", "2s", "2p"].map(sub => {
    const v = { n: 0 };
    const out = h("output", {}, "0");
    const bar = h("div", { class: "bar", style: "height:0px" });
    const set = d => { v.n = Math.max(0, Math.min(8, v.n + d)); out.textContent = v.n; bar.style.height = (v.n * 8) + "px"; };
    return { sub, v, el: h("div", { class: "slot" }, h("div", {}, sub), bar, h("div", {}, h("button", { class: "ghost", onclick: () => set(-1), "aria-label": "Fewer " + sub }, "−"), " ", out, " ", h("button", { class: "ghost", onclick: () => set(1), "aria-label": "More " + sub }, "+"))) };
  });
  box.append(h("div", { class: "draw" }, ...slots.map(s => s.el)));
  const chk = h("div", { class: "fb" });
  box.append(h("p", {}, h("button", { class: "btn", onclick: () => {
    const want = D.occupied(10).map(o => o.count);
    const got = slots.map(s => s.v.n);
    const bad = slots.filter((s, i) => got[i] !== want[i]).map(s => s.sub);
    if (!bad.length) fb(chk, true, "✔ Matches neon: 2, 2 and 6 electrons. The 2p bar is the tallest.");
    else fb(chk, false, "Check " + bad.join(" and ") + ". Compare with the solid bars above.");
    logResp("p3:draw", slots.map(s => s.v.n).join(","));
  } }, "Compare with the real spectrum")), chk);
  box.append(h("p", {}, h("button", { class: "btn", onclick: next("p4") }, "Continue to Part 4")));

}

  p.append(h("p", { class: "hint" }, "Band structure: 1 = Z 1, 2, 3, 10 with tags; 2 = Z 1 to 18 with tags removed; 3 = cross-element reasoning and a flawed claim. Promote after two right with no hint; demote after two misses."));
}

/* ============ boot ============ */
(function boot() {
  try { const s = JSON.parse(sessionStorage.getItem("pes.state") || "null"); if (s && s.band) { ST.band = Object.assign(ST.band, s.band); ST.log = s.log || []; ST.notes = s.notes || {}; } } catch (e) {}
  if (KEY) { ST.id = ST.id || "teacher"; ST.screen = (location.hash.match(/screen=(\w+)/) || [])[1] || "start"; }
  chips(); render();
})();
</script>
