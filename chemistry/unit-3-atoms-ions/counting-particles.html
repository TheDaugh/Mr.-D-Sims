const P=ChemParticles,EL=P.EL,C=P.counts,SYM=P.symHTML,ST_=P.symText;
const cls=(p,e)=>p===e?0:(p>e?1:2);                       // 0 neutral atom, 1 positive ion, 2 negative ion
const sgn=q=>q===0?"0":(q>0?"+":"−")+Math.abs(q);

/* ============ DATA: every answer below is computed from Z, A and charge by ChemParticles.counts ============ */
const DATA={parts:[
{title:"Same Element, Different Weight",sub:"Two kinds of carbon. One of them dated a mummy. First, how to read the name tag.",blocks:[
 {type:"info",html:"In 1991 two hikers found a body in the ice of the Alps. Scientists named him <b>Ötzi</b> and dated him at about 5,300 years old with <b>carbon-14</b>, a heavier version of carbon. Heavier, yet still carbon."},
 {type:"figure",items:[{src:"img/otzi.png",cap:"Ötzi the Iceman, found in the Ötztal Alps in 1991. Radiocarbon dating put his age near 5,300 years.",alt:"Photograph of the Iceman mummy",credit:"Placeholder · photo to be added from Wikimedia Commons",ph:"Photo placeholder: Ötzi the Iceman"}]},
 {type:"mcq",predict:true,reason:true,q:"Ordinary carbon atoms have a mass of 12 units. Carbon-14 atoms have a mass of 14 units. Both are carbon. What is different inside the heavier atom?",opts:[{t:"It has 2 more protons"},{t:"It has 2 more neutrons"},{t:"It has 2 more electrons"},{t:"It is a different element hiding as carbon"}],note:"Now compare the two nuclei."},
 {type:"nuc2",items:[{p:6,n:6,e:6,label:"Carbon-12 (ordinary carbon)"},{p:6,n:8,e:6,label:"Carbon-14 (the dating atom)"}],html:"Count the red and gray balls in each nucleus. <b>Protons are red. Neutrons are gray. Electrons are the blue dots.</b> The extra mass is neutrons. The proton count did not move, so both are carbon."},
 {type:"anat",Z:11,A:23,q:1},
 {type:"num",q:"Sodium's <b>atomic number is 11</b>. How many protons does every sodium atom have?",ans:11,tol:.01,unit:"protons",why:"The atomic number <i>is</i> the proton count. Every atom with 11 protons is sodium. No exceptions.",hint:"The bottom number of the symbol is the number of protons."},
 {type:"num",q:"An atom has 8 protons and 8 neutrons. What is its <b>mass number</b>?",ans:16,tol:.01,unit:"(mass number)",why:"Mass number = protons + neutrons = 8 + 8 = 16.",hint:"Mass number counts the particles in the nucleus."},
 {type:"num",q:"This atom is written "+SYM(13,27,0)+". How many <b>neutrons</b> does it have?",ans:C(13,27,0).n,tol:.01,unit:"neutrons",why:"Neutrons = mass number − atomic number = 27 − 13 = 14.",hint:"Top number minus bottom number.",m:{Z:13,A:27,q:0,ask:"n"}},
 {type:"num",q:"A <b>neutral</b> atom of fluorine has 9 protons. How many electrons does it have?",ans:9,tol:.01,unit:"electrons",why:"Neutral means the charges cancel, so electrons = protons = 9.",hint:"Neutral atoms have equal protons and electrons."},
 {type:"num",q:"A magnesium ion is written "+SYM(12,24,2)+". It has 12 protons. How many <b>electrons</b> does it have?",ans:C(12,24,2).e,tol:.01,unit:"electrons",why:"The 2+ charge means 2 more protons than electrons. 12 − 2 = 10 electrons. Mg lost 2 electrons.",hint:"A positive charge means electrons were lost. Start at 12 and take away.",m:{Z:12,A:24,q:2,ask:"e"}},
 {type:"mcq",q:"A chloride ion is written "+SYM(17,35,-1)+". Which statement is true?",opts:[{t:"It has 17 electrons"},{t:"It has 18 electrons: it gained one",ok:1},{t:"It has 16 electrons: it lost one"},{t:"It has 18 protons"}],why:"The charge is 1−, so there is one extra electron: 17 + 1 = 18. The proton count (17) never changes in an ion.",hint:"Negative means extra electrons. What stays fixed in an ion: protons or electrons?",m:{Z:17,A:35,q:-1,ask:"e"}}
]},
{title:"Symbol Builder",sub:"Build particles, decode symbols, write symbols. Try everything before you answer questions.",blocks:[
 {type:"info",html:"<b>Explore</b> lets you add and remove particles and watch the symbol change. <b>Decode</b> gives you a symbol and asks for the counts. <b>Write</b> gives you the counts and asks for the symbol. Finish all five tasks."},
 {type:"widget",id:"builder",tasks:["Make a neutral carbon atom with 8 neutrons.","Make a sodium ion with a 1+ charge (11 protons).","Make an oxide ion with a 2− charge (8 protons).","Decode 3 symbols correctly.","Write 3 symbols correctly."]},
 {type:"rows",q:"From what you saw in Explore: what does each change do?",choices:["Mass number only","Charge only","Which element it is"],rows:[
  {q:"Add one neutron.",ans:0,why:"One more nucleon means a mass number one higher. Protons and electrons are untouched."},
  {q:"Remove one electron.",ans:1,why:"Fewer electrons than protons gives a positive charge. The nucleus is untouched."},
  {q:"Change the number of protons.",ans:2,why:"Protons name the element. (It also moves the mass number and charge, but identity is what changes.)"}],hint:"Which particles sit in the nucleus? Which one decides the element?"},
 {type:"mcq",predict:true,pulse:true,fixed:true,q:"An ion is written "+SYM(16,32,-2)+". Which set of counts is right?",
  opts:[{t:"16 protons, 16 neutrons, 18 electrons",ok:1},{t:"16 protons, 16 neutrons, 14 electrons"},{t:"16 protons, 18 neutrons, 16 electrons"},{t:"32 protons, 16 neutrons, 18 electrons"}],
  meaning:["Correct: 16 p, 32−16 = 16 n, 16+2 = 18 e.","Charge-sign error: treated 2− like 2+ (lost electrons instead of gaining).","Charge confusion: put the charge into the neutrons.","Atomic vs mass number: used 32 as the proton count."],
  note:"Locked in. Stop here and look up for the huddle."},
 {type:"gate",id:1,say:"Huddle 1 (at the board). Put the four pulse answers A to D on the board with the class split from the live view or the projector tally. Ask a B voter, a C voter and a D voter to say what they did. Name each error without shaming it: B flipped the charge sign, C added the charge to the neutrons, D used the mass number as the proton count. Then have everyone state the three rules aloud: protons = Z, neutrons = A − Z, electrons = Z − charge. Run symbol cards 1 and 2 on whiteboards if time allows."},
 {type:"info",html:"<b>Huddle answer:</b> A. 16 protons (the 16 at the bottom), 32 − 16 = 16 neutrons, and a 2− charge means <b>two extra</b> electrons: 16 + 2 = 18. B flipped the sign. C pushed the charge into the neutrons. D used the mass number as the proton count."}
]},
{title:"Read the Diagram",sub:"Each picture is a particle. Count what you see, then write its symbol.",blocks:[
 {type:"sym",diag:{p:3,n:4,e:3},q:"Count the particles in the diagram. Write its symbol.",ans:{Z:3,A:7,q:0},why:"3 protons: lithium. Mass number 3 + 4 = 7. Charge 3 − 3 = 0. It is "+ST_(3,7,0)+".",hint:"Element from protons. Mass number is protons + neutrons. Charge is protons − electrons."},
 {type:"pick",v:[
  {type:"sym",diag:{p:11,n:12,e:10},q:"Count the particles. Write its symbol.",ans:{Z:11,A:23,q:1},why:"11 protons: sodium. 11 + 12 = 23. 11 − 10 = +1. It is "+ST_(11,23,1)+".",hint:"Compare the red balls with the blue dots for the charge."},
  {type:"sym",diag:{p:13,n:14,e:10},q:"Count the particles. Write its symbol.",ans:{Z:13,A:27,q:3},why:"13 protons: aluminum. 13 + 14 = 27. 13 − 10 = +3. It is "+ST_(13,27,3)+".",hint:"Three more protons than electrons is a 3+ charge."},
  {type:"sym",q:"A particle has <b>26 protons</b>, <b>30 neutrons</b> and <b>23 electrons</b>. Write its symbol.",ans:{Z:26,A:56,q:3},why:"26 protons: iron. 26 + 30 = 56. 26 − 23 = +3. It is "+ST_(26,56,3)+".",hint:"Same three steps. No picture this time."}
 ]},
 {type:"pick",v:[
  {type:"mcq",diag:[{p:6,n:6,e:6,label:"Particle X"},{p:6,n:8,e:6,label:"Particle Y"}],q:"How are particles X and Y related?",opts:[{t:"Isotopes of the same element",ok:1},{t:"The same element with different charges"},{t:"Two different elements"},{t:"The exact same particle"}],why:"Both have 6 protons, so both are carbon. They differ only in neutrons, so they are isotopes.",hint:"Compare the red balls first. Then compare what is different."},
  {type:"mcq",diag:[{p:17,n:18,e:18,label:"Particle X"},{p:17,n:20,e:17,label:"Particle Y"}],q:"How are particles X and Y related?",opts:[{t:"Different elements"},{t:"Same element, different in neutrons and in electrons",ok:1},{t:"Same element, different only in neutrons"},{t:"Same element, different only in charge"}],why:"Both have 17 protons: chlorine. X has 18 neutrons and 18 electrons (a 1− ion). Y has 20 neutrons and 17 electrons (a neutral atom). Two things differ.",hint:"Make a table: protons, neutrons, electrons for each. Which columns match?"},
  {type:"mcq",diag:[{p:8,n:8,e:10,label:"Particle X"},{p:9,n:10,e:10,label:"Particle Y"}],q:"X and Y have the same number of electrons. Are they the same element?",opts:[{t:"Yes. Same electrons means same element."},{t:"No. X has 8 protons and Y has 9, so they are different elements.",ok:1},{t:"Yes, they are isotopes."},{t:"No, but they have the same mass number."}],why:"Electrons do not decide the element. Protons do. X (8 p) is oxygen as O²⁻. Y (9 p) is fluorine as F⁻.",hint:"Which count names an element?"}
 ]},
 {type:"rows",q:"Decide what each particle is.",choices:["Neutral atom","Positive ion","Negative ion"],rows:[[7,7],[12,10],[9,10],[20,18],[16,18]].map(([p,e])=>({q:p+" protons and "+e+" electrons",ans:cls(p,e),why:p+" − "+e+" = "+sgn(p-e)+". "+["Equal counts, so neutral.","More protons than electrons: positive.","More electrons than protons: negative."][cls(p,e)]})),hint:"Compare protons with electrons. Which is bigger?"}
]},
{title:"Close the Gaps",sub:"The three mix-ups that cost the most points: the two numbers, the charge sign, and isotope names.",blocks:[
 {type:"num",q:"<b>Atomic vs mass number.</b> An atom has <b>20 neutrons</b> and a <b>mass number of 37</b>. What is its atomic number?",ans:17,tol:.01,unit:"(atomic number)",why:"Mass number = protons + neutrons, so protons = 37 − 20 = 17. Atomic number 17 is chlorine.",hint:"Mass number minus neutrons gives the protons.",save:"azAns"},
 {type:"mcq",q:"A student writes oxygen-16 as <span class='sy'><span class='sn'><sup>8</sup><sub>16</sub></span><span class='se'>O</span></span>. What is the mistake?",opts:[{t:"The mass number and atomic number are swapped. It should be <span class='sy'><span class='sn'><sup>16</sup><sub>8</sub></span><span class='se'>O</span></span>.",ok:1},{t:"Oxygen should always have a 2− charge."},{t:"The 16 should be the number of electrons."},{t:"Nothing. Both numbers mean the same thing."}],why:"Mass number goes on top and is the larger number here (16). Atomic number goes on the bottom (8 protons).",hint:"Which number is bigger: protons, or protons plus neutrons?"},
 {type:"pick",v:[
  {type:"num",q:"<b>Charge sign.</b> An ion has <b>16 protons</b> and <b>18 electrons</b>. What is its charge? Type it with its sign (like 2 or -2).",ans:-2,tol:.01,unit:"(charge)",why:"Charge = protons − electrons = 16 − 18 = −2. More electrons than protons is negative.",hint:"Protons minus electrons. If the answer is negative, so is the charge.",save:"chgAns"},
  {type:"mcq",q:"<b>Charge sign.</b> Which of these ions has <b>more electrons than protons</b>?",opts:[{t:SYM(12,24,2)},{t:SYM(13,27,3)},{t:SYM(16,32,-2),ok:1},{t:SYM(19,39,1)}],why:"Only a negative charge means extra electrons. S²⁻ has 18 electrons and 16 protons. The others lost electrons.",hint:"Which sign means electrons were gained?"},
  {type:"num",q:"<b>Charge sign.</b> An ion of "+SYM(26,56,0)+" (iron-56) has <b>23 electrons</b>. What is its charge? Type it with its sign.",ans:3,tol:.01,unit:"(charge)",why:"Charge = protons − electrons = 26 − 23 = +3. Iron lost three electrons, so it is Fe³⁺.",hint:"Iron has 26 protons. Compare with 23 electrons.",save:"chgAns"}
 ]},
 {type:"pick",v:[
  {type:"num",q:"<b>Isotope names.</b> Carbon-14 is the dating atom. How many <b>neutrons</b> does one carbon-14 atom have?",ans:8,tol:.01,unit:"neutrons",why:"The 14 in the name is the mass number. Neutrons = 14 − 6 = 8.",hint:"The number in the name is the mass number, not the neutrons.",save:"c14"},
  {type:"mcq",q:"<b>Isotope names.</b> Which two particles are <b>isotopes</b> of each other?",opts:[{t:SYM(6,14,0)+" and "+SYM(7,14,0)},{t:SYM(8,16,0)+" and "+SYM(8,18,0),ok:1},{t:SYM(12,24,0)+" and "+SYM(13,27,0)},{t:SYM(9,19,0)+" and "+SYM(10,20,0)}],why:"Isotopes have the same protons and different neutrons. O-16 and O-18 both have 8 protons. The others have different protons, so they are different elements.",hint:"Same element means the same bottom number. Then the top numbers must differ.",save:"c14"},
  {type:"sym",q:"<b>Isotope names.</b> Write the symbol for a <b>tin-120</b> ion that has lost <b>4 electrons</b>. (Tin has 50 protons.)",ans:{Z:50,A:120,q:4},why:"The 120 in the name is the mass number. Tin has 50 protons, so it has 70 neutrons. Losing 4 electrons leaves 46 electrons, so the charge is 50 − 46 = +4. "+ST_(50,120,4)+".",hint:"Mass number from the name. Atomic number from the element. Charge from the lost electrons.",save:"c14"}
 ]},
 {type:"cer",q:"A student says: “Chlorine-35 and chlorine-37 must be different elements, because their masses are different.” Use particle counts to judge this claim.",save:"cer"}
]}
]};
const TAKEAWAYS=[
 {type:"rows",flag:"rules",q:"Match each count to the rule that gives it.",choices:["Atomic number (the bottom number)","Mass number − atomic number","Atomic number − charge"],rows:[{q:"Protons",ans:0,why:"Protons = atomic number. It never changes for an element."},{q:"Neutrons",ans:1,why:"Neutrons = A − Z. Charge does not touch them."},{q:"Electrons",ans:2,why:"Electrons = Z − charge. A 2− ion has two more than its protons."}],hint:"Which of these three counts depends on the charge?"},
 {type:"mcq",flag:"iso",q:"Two isotopes of the same element always differ in their number of…",opts:[{t:"protons"},{t:"neutrons",ok:1},{t:"electrons"},{t:"atomic number"}],why:"Same protons (same element). Different neutrons gives a different mass number.",hint:"Isotopes keep the same element, so which count must stay put?"},
 {type:"journal",flag:"journal"}
];
const SKILLS=[["chem.particles.read","Reading the symbol"],["chem.particles.builder","Symbol builder"],["chem.particles.diagram","Reading diagrams"],["chem.particles.confusions","Closing the gaps"]];
</script>

/* ---------- the particle picture: nucleus (red protons, gray neutrons) and electron shells ---------- */
function nucleus(p,n,e,label){

  const seq=[];let pc=0;for(let i=0;i<N;i++){const want=Math.round((i+1)*p/N);if(pc<want){seq.push(1);pc++}else seq.push(0)}
  const caps=[2,8,8,2];let left=e;
  for(let k=0;k<4&&left>0;k++){const c=Math.min(caps[k],left);left-=c;const r=R0+18*k+10;
    svg.append(sv("circle",{cx:150,cy:150,r:r,fill:"none",stroke:"#9aa7b5","stroke-width":1,"stroke-dasharray":"3 4",opacity:.7}));
    for(let j=0;j<c;j++){const a=2*Math.PI*j/c+k*.7;svg.append(sv("circle",{cx:(150+r*Math.cos(a)).toFixed(1),cy:(150+r*Math.sin(a)).toFixed(1),r:4.8,fill:"#2f6fb3",stroke:"#14375f","stroke-width":.8}))}}
  for(let i=0;i<N;i++){const d=rr*1.75*Math.sqrt(i+.5),a=i*2.39996,x=150+d*Math.cos(a),y=150+d*Math.sin(a);
    svg.append(sv("circle",{cx:x.toFixed(1),cy:y.toFixed(1),r:(rr*.95).toFixed(1),fill:seq[i]?"#d9482b":"#8c96a3",stroke:seq[i]?"#7a2110":"#4d5662","stroke-width":.9}));
    if(seq[i]&&rr>=7)svg.append(sv("text",{x:x.toFixed(1),y:(y+3.5).toFixed(1),"text-anchor":"middle","font-size":rr*1.1,fill:"#fff","font-weight":700},"+"))}
  return svg;
}

const CARDS=[

function printCards(){

  const css=`body{font-family:system-ui,sans-serif;margin:0}.page{page-break-after:always;padding:.4in}.g{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.2in}.c{border:3px solid #000;border-radius:14px;height:3.6in;display:flex;flex-direction:column;align-items:center;justify-content:center}.c small{font-size:16px;letter-spacing:.1em}

  table{border-collapse:collapse;width:100%}td,th{border:1px solid #000;padding:6px 8px;text-align:left;font-size:14px;vertical-align:top}@page{size:letter landscape;margin:.3in}`;
  const cards=CARDS.map((c,i)=>`<div class="c"><small>CARD ${i+1}</small>${sym(c)}</div>`).join("");
  const rows=CARDS.map((c,i)=>{const n=C(c.Z,c.A,c.q);return`<tr><td>${i+1}</td><td>${c.k}</td><td>${ST_(c.Z,c.A,c.q)} (${EL[c.Z].n}${c.k==="Isotope"?"-"+c.A:""})</td><td>${n.p}</td><td>${n.n}</td><td>${n.e}</td><td>${c.err}</td></tr>`}).join("");
  w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Symbol cards</title><style>${css}</style></head><body><div class="page"><h2 style="margin:0 0 .15in">Symbol cards: show one at a time. Students hold up protons / neutrons / electrons.</h2><div class="g">${cards}</div></div><div class="page"><h2>Answer key (teacher copy)</h2><table><tr><th>#</th><th>Type</th><th>Symbol</th><th>p</th><th>n</th><th>e</th><th>Likely wrong answer</th></tr>${rows}</table><p>Run order: 1, 2 as a warm check; 3 and 4 for the sign; 5 then 6 together (same protons, different neutrons). Tally the top two wrong answers: tomorrow’s warm-up. Tomorrow: isotopes, average atomic mass, mass spectra.</p></div></body></html>`);
  w.document.close();setTimeout(()=>w.print(),400);
}
