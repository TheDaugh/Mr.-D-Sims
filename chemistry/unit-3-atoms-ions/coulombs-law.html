const C=CoulombPractice;
/* ============ DATA ============ */
const GATE_Q={q:"Two charges are 2 cm apart. They are moved to 6 cm apart. The force becomes:",opts:[{L:"A",t:"⅓ as big",tag:"inv"},{L:"B",t:"1⁄9 as big",tag:"ok"},{L:"C",t:"1⁄6 as big",tag:"other"},{L:"D",t:"3 times as big",tag:"lin"}]};

{title:"What pulls the hair?",sub:"A rubbed balloon pulls hair up without touching it. Today you find out how that pull depends on distance and charge.",blocks:[

 {type:"widget",id:"hook",tasks:["Slide the balloon close, then far."]},
 {type:"figure",items:[{src:"img/balloon-hair.png",cap:"A charged balloon pulls on hair across a gap. Photo: MikeRun.",alt:"A balloon held above hair, with strands of hair reaching up toward it",credit:"CC BY-SA 4.0 · Wikimedia Commons"}]},
 {type:"mcq",q:"What pulls the hair toward the balloon, even though they do not touch?",opts:[{t:"Gravity from the balloon"},{t:"Magnetism"},{t:"An electric force between the charge on the balloon and the charge in the hair",ok:1},{t:"Wind from the room"}],why:"Rubbing moves electrons, so the balloon and hair end up with opposite charges. Opposite charges pull on each other across a gap.",hint:"What did the rubbing move from one thing to the other?"},
 {type:"labels"}
]},
{title:"Six quick questions",sub:"Warm up the words before the sim.",blocks:[]},
{title:"Sim 1: Change the distance",sub:"Both charges stay +1. Only the distance changes.",blocks:[
 {type:"numpred",save:"predDist",q:"Predict first. The force is <b>36 units</b> at distance 1. What will it be at distance 3?",unit:"units"},

 {type:"cloze",save:"ruleDist",flag:"ruleDist",q:"Finish the rule from your table.",bank:RULE_BANK,items:[{t:"When the distance doubles, the force is ___ as big.",a:"one quarter"},{t:"When the distance triples, the force is ___ as big.",a:"one ninth"}],hint:"Look at your Force × column for distance 2 and distance 3.",okMsg:"✔ Distance ×2 gives force × ¼. Distance ×3 gives force × 1⁄9."}
]},
{title:"Sim 2: Change a charge",sub:"The distance stays 1. Only the left charge changes.",blocks:[
 {type:"numpred",save:"predChg",q:"Predict first. The force is <b>36 units</b> with charges +1 and +1. What will it be if the left charge becomes <b>+3</b>?",unit:"units"},

 {type:"cloze",save:"ruleBoth",flag:"ruleBoth",q:"Finish the rule from your table.",bank:["half as big","the same","twice as big","one quarter","four times"],items:[{t:"Distance doubles and one charge doubles: the force is ___.",a:"half as big"},{t:"Distance doubles and both charges double: the force is ___.",a:"the same"}],hint:"Check your Force × column. Distance ×2 is ¼. Each charge ×2 is ×2.",okMsg:"✔ ¼ × 2 = ½, and ¼ × 2 × 2 = 1."},

 {type:"gate2"}
]},

 {type:"compare"},

 {type:"mcq",predict:true,q:"Predict first. In the same ion, which electron is pulled harder by the nucleus?",opts:[{t:"The electron in shell 1, close to the nucleus"},{t:"The electron in shell 3, far from the nucleus"},{t:"Both are pulled the same"}],note:"Now test it."},
 {type:"widget",id:"shell",tasks:["Test H in shell 2 and shell 3.","Test He⁺ in shell 1.","Test Li²⁺ in shell 1."]},
 {type:"widget",id:"zeff",only:"fluent",tasks:["Move the slider to 2 inner electrons."]},

 {type:"num",save:"times81",q:"The shell 1 electron is pulled how many times as hard as the shell 3 electron in the same ion?",ans:81,tol:0.5,unit:"times",why:"Shell 3 is 9 times as far, so the pull is divided by 9 × 9 = 81.",hint:"Distance 9 times as big: divide the force by 9 × 9."}

function h(tag,attrs,...kids){const e=document.createElement(tag);for(const k in(attrs||{})){if(k==="class")e.className=attrs[k];else if(k==="html")e.innerHTML=attrs[k];else if(k.startsWith("on"))e.addEventListener(k.slice(2),attrs[k]);else e.setAttribute(k,attrs[k])}kids.flat().forEach(c=>{if(c==null)return;e.append(c.nodeType?c:document.createTextNode(c))});return e}

let inProgress=false,uid=0,LOCK_ON=false;
const app=document.getElementById("app"),chipsEl=document.getElementById("chips");
window.addEventListener("beforeunload",e=>{if(inProgress){e.preventDefault();e.returnValue=""}});
const fmtT=s=>{s=Math.floor(s);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
const DONE_TYPES=["mcq","num","numpred","rows","widget","open","gate2","cloze","labels","ladder","cer","journal"];
const LESSON_ID="coulombs-law";

LessonLock.init({id:LESSON_ID,root:document.querySelector(".wrap"),onChange:()=>chips()});

const g=n=>(Math.round(n*100)/100).toString();
const NAMES={"¼":.25,"½":.5,"¾":.75,"⅓":1/3,"⅔":2/3,"⅙":1/6,"⅛":.125,"⅕":.2,"⅒":.1};
/* A ratio can be typed as 0.25, 1/4, ¼ or ×4. Returns NaN when it cannot be read. */
function parseRatio(s){s=String(s==null?"":s).trim().replace(/[×x*]/gi,"").replace(/⁄|∕/g,"/").replace(/\s+/g,"").replace(/,/g,".");if(!s)return NaN;if(NAMES[s]!=null)return NAMES[s];
  const m=/^(-?\d*\.?\d+)\/(-?\d*\.?\d+)$/.exec(s);if(m)return +m[1]/+m[2];if(/^-?\d*\.?\d+$/.test(s))return +s;return NaN}
const near=(v,t)=>Math.abs(v-t)<=Math.max(0.001,Math.abs(t)*0.015);
const typed=(id,prompt,text)=>{text=String(text==null?"":text).trim();if(text!=="")ST.typed.push({id,prompt:String(prompt).replace(/<[^>]+>/g,"").slice(0,90),text:text.slice(0,500),at:Math.round((Date.now()-ST.t0)/1000)})};

const WIDGET={};

/* The hook: a pixel-art balloon over a head. Hair strands rise with the pull, which falls off as 1 ÷ distance². */
WIDGET.hook=(tick)=>{
  const W=64,H=40,S=8,cv=h("canvas",{class:"hook",width:W*S,height:H*S,role:"img","aria-label":"Pixel art of a balloon held above a head. The hair strands reach up toward the balloon, more when it is closer."}),ctx=cv.getContext("2d");
  let d=5,seenNear=false,seenFar=false,t=0,raf=0,paused=false;
  const px=(x,y,c)=>{ctx.fillStyle=c;ctx.fillRect(Math.round(x)*S,Math.round(y)*S,S,S)};
  const disc=(cx,cy,r,c)=>{for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++)if(x*x+y*y<=r*r+r*.6)px(cx+x,cy+y,c)};
  const line=(x0,y0,x1,y1,c)=>{x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy;for(let k=0;k<200;k++){px(x0,y0,c);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx}if(e2<=dx){e+=dx;y0+=sy}}};
  const pull=()=>Math.min(1,1/(d*d)*1.0);  // relative pull: 1 at distance 1, 1/4 at 2, 1/25 at 5
  function draw(){
    ctx.fillStyle="#dfe9f2";ctx.fillRect(0,0,W*S,H*S);ctx.fillStyle="#b9c9d6";ctx.fillRect(0,(H-4)*S,W*S,4*S);
    const p=pull(),hx=32,hy=30;
    disc(hx,hy+4,9,"#e0ac82");px(hx-3,hy+3,"#222");px(hx+3,hy+3,"#222");line(hx-2,hy+8,hx+2,hy+8,"#8a3b2a");
    const wob=reduce||paused?0:Math.sin(t/9);
    for(let i=-6;i<=6;i+=2){const bx=hx+i,by=hy-4+Math.abs(i)*.18,lean=-i*.45*p,len=3+10*p+(p>.15?wob*p*1.5:0),tipx=bx+lean+(i<0?-1:1)*(1-p)*4,tipy=by+(1-p)*9-len*p*1.2;line(bx,by,tipx,tipy,"#5b3a1e")}
    const by=Math.max(5,hy-9-d*4),bxx=hx;line(bxx,by+7,bxx,by+11,"#444");disc(bxx,by,6,"#d9382b");px(bxx-2,by-3,"#f6a49b");px(bxx-3,by-2,"#f6a49b");
    ctx.fillStyle="#1c2530";ctx.font="bold 14px system-ui";ctx.fillText("distance "+d,8,20);ctx.fillText("pull "+(p>=.995?"big":p>.2?"medium":p>.06?"small":"tiny"),8,38);
  }
  function loop(){t++;if(!cv.isConnected)return;if(!paused&&!reduce)draw();raf=requestAnimationFrame(loop)}
  const sl=h("input",{type:"range",min:1,max:6,step:1,value:d,"aria-label":"Balloon distance",oninput:e=>{d=+e.target.value;if(d<=1)seenNear=true;if(d>=5)seenFar=true;draw();if(seenNear&&seenFar)tick(0)}});
  const pb=h("button",{class:"ghost",onclick:()=>{paused=!paused;pb.textContent=paused?"Play":"Pause";draw()}},"Pause");
  draw();loop();
  return h("div",{},cv,h("div",{class:"ctl",style:"justify-content:center"},h("label",{style:"min-width:260px"},"Balloon distance: slide it",sl),pb));
};

/* The coulomb sim. Distance 1 and two +1 charges give 36 force units. Proportions only: no constants. */
WIDGET.coulomb=(tick,cfg)=>{
  const exp=cfg.exp,route=ST.route,scaf=route==="scaf",flu=route==="fluent",FMAX={dist:36,charge:108,both:324}[exp];
  const rows=ST.data[exp];rows.length=0;
  let q1=1,q2=1,r=1,sgn=1,paused=false,t=0;
  const svg=sv("svg",{class:"scene",viewBox:"0 0 520 215",role:"img","aria-label":"Two charged particles on a line with a distance ruler, force arrows and a force meter"});
  const out=h("div",{class:"note","aria-live":"polite",style:"margin-top:6px;min-height:1.3em"});
  const X=60,PX=70,AX=100;
  function draw(){
    svg.replaceChildren();const F=C.force(q1,sgn*q2,r),x1=X,x2=X+PX*r,att=sgn<0,amp=(paused||reduce)?0:1+5*Math.min(1,F/FMAX),j=Math.sin(t/3)*amp;
    for(let i=0;i<=6;i++){const x=X+PX*i;svg.append(sv("line",{x1:x,y1:AX+34,x2:x,y2:AX+42,stroke:"currentColor","stroke-opacity":.5}),sv("text",{x,y:AX+56,"text-anchor":"middle","font-size":11,fill:"currentColor","fill-opacity":.7},String(i)))}
    svg.append(sv("line",{x1:X,y1:AX+38,x2:X+PX*6,y2:AX+38,stroke:"currentColor","stroke-opacity":.4}),sv("text",{x:X+PX*6+10,y:AX+42,"font-size":11,fill:"currentColor","fill-opacity":.7},"distance"));
    svg.append(sv("line",{x1,y1:AX+22,x2:x1,y2:AX+34,stroke:"var(--accent)","stroke-width":2}),sv("line",{x1:x2,y1:AX+22,x2:x2,y2:AX+34,stroke:"var(--accent)","stroke-width":2}),sv("line",{x1,y1:AX+28,x2,y2:AX+28,stroke:"var(--accent)","stroke-width":2}));
    svg.append(sv("text",{x:(x1+x2)/2,y:AX+20,"text-anchor":"middle","font-size":12,"font-weight":700,fill:"var(--accent)"},"distance = "+r));
    const rad=q=>11+6*q,L=14+68*Math.min(1,F/FMAX),dirL=att?1:-1,dirR=att?-1:1;
    const arrow=(x,dir,c)=>{const e=x+dir*L;svg.append(sv("line",{x1:x,y1:AX,x2:e,y2:AX,stroke:c,"stroke-width":4}),sv("polygon",{points:`${e},${AX} ${e-dir*10},${AX-6} ${e-dir*10},${AX+6}`,fill:c}))};
