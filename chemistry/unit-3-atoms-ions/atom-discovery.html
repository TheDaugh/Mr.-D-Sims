<script>
/* ============ DATA ============ */
const DATA={parts:[
{title:"Cut It Forever",tier:1,sub:"Democritus claimed you would eventually reach a piece that cannot be cut. He never tried it. You will.",blocks:[
 {type:"info",html:"Around 400 BCE, <b>Democritus</b> argued: cut a piece of matter in half, then half again. Either you can do this forever, or you reach a piece too small to cut. He called that piece <b>atomos</b> (“uncuttable”). He reasoned his way there. He never measured anything."},
 {type:"figure",items:[{"src": "img/democritus.png", "cap": "Democritus, painted by Hendrick ter Brugghen (1628). Called “the laughing philosopher.” He argued for atoms with logic alone.", "alt": "Painting of Democritus", "credit": "Public domain · Wikimedia Commons"}]},
 {type:"mcq",predict:true,q:"A cube of gold about 1 cm on a side. Cut it in half and keep one half. Cut that in half, and keep going. About how many cuts until you are holding <b>one single atom</b>?",opts:[{t:"About 10 cuts"},{t:"About 30 cuts"},{t:"About 75 cuts"},{t:"About 1,000 cuts"},{t:"Forever. You can always cut it again."}],note:"Write it in the Cold Open box on your sheet."},
 {type:"widget",id:"halve",tasks:["Keep cutting until only one gold atom is left."]},
 {type:"figure",items:[{"src": "img/goldstm.png", "cap": "A gold surface imaged with a scanning tunneling microscope. The ridges are rows of gold atoms, so these are real atoms in a real picture.", "alt": "Scanning tunneling microscope image of gold atoms in rows", "credit": "Public domain · Wikimedia Commons"}]},
 {type:"num",q:"How many cuts did it take to get from the whole cube down to one atom?",ans:75,tol:1,unit:"cuts",why:"Every cut halves the number of atoms. The cube starts with about 4 × 10²² of them, which is 2⁷⁵. Halve that 75 times and one is left. The longest side shrinks by half only every third cut, because the cube has three directions to cut in.",hint:"Look at the “cuts so far” number when the atom count reaches 1."},
 {type:"mcq",q:"You are holding one gold atom. Your tools cannot cut it. Does that <b>prove</b> Democritus was right that atoms can’t be divided?",opts:[{t:"Yes. If no tool can cut it, it can’t be cut."},{t:"No. It shows our tools stop here. A better tool might still split it.",ok:1},{t:"Yes. Gold atoms are solid all the way through."}],why:"Failing to cut something is not proof it can’t be cut. Democritus had a good argument but no evidence. Getting evidence is what Dalton did.",hint:"Think about the difference between “we can’t” and “it can’t be done.”"}
]},
{title:"Make Water",tier:1,sub:"Burn hydrogen in oxygen and weigh everything before and after. Look for a pattern in the masses.",blocks:[
 {type:"info",html:"In 1799 <b>Joseph Proust</b> weighed the elements in compounds from many sources and found something odd: a given compound always had the same recipe by mass. Test that with water."},
 {type:"figure",items:[{"src": "img/proust.png", "cap": "Joseph Proust (1754–1826), in a bronze medallion by David d'Angers. He showed that a compound always has the same recipe by mass.", "alt": "Bronze medallion portrait of Joseph Proust", "credit": "CC0 · Wikimedia Commons"}, {"src": "img/lavoisier.png", "cap": "Antoine and Marie-Anne Lavoisier, painted by Jacques-Louis David (1788). He weighed everything. She drew his lab apparatus and kept his notes.", "alt": "Painting of Antoine Lavoisier and his wife Marie-Anne", "credit": "Public domain · Wikimedia Commons"}]},
 {type:"mcq",predict:true,q:"You will spark different amounts of hydrogen and oxygen. What will happen?",opts:[{t:"Any amounts can combine completely into water."},{t:"Hydrogen and oxygen only combine in one fixed mass ratio. Extra of either is left over."},{t:"The ratio changes depending on how much you start with."}],note:"Now test it below."},
 {type:"widget",id:"water",tasks:["Run a trial where nothing is left over.","Run a trial where oxygen is left over.","Run a trial where hydrogen is left over."]},
 {type:"num",q:"In your trials, how many grams of oxygen were used for every 1 g of hydrogen used?",ans:8,tol:0.01,unit:"g O per 1 g H",why:"Every trial that used both up gave O used ÷ H used = 8. Water is 8 parts oxygen to 1 part hydrogen by mass, every time.",hint:"Pick a trial. Divide the oxygen used by the hydrogen used. Do the same for a second trial."},
 {type:"num",q:"Predict: you spark <b>4 g of hydrogen</b> with <b>40 g of oxygen</b>. How many grams of water form?",ans:36,tol:0.01,unit:"g water",why:"4 g H needs 32 g O (4 × 8). Together that is 36 g of water. 8 g of oxygen is left over.",hint:"First find how much oxygen 4 g of hydrogen can use. Only that much reacts."},
 {type:"num",q:"How many grams of oxygen are left over in that trial?",ans:8,tol:0.01,unit:"g O",why:"40 g supplied − 32 g used = 8 g left.",hint:"Supplied minus used."},
 {type:"mcq",q:"Compare the total mass <b>before</b> the spark with the total mass <b>after</b> (water plus anything left over). What do you see in every trial?",opts:[{t:"The total after is a little smaller. Some mass turned into energy."},{t:"The total mass is the same before and after.",ok:1},{t:"The total after is bigger because water is new."}],why:"Mass in = mass out. Lavoisier (1789) weighed everything in sealed containers and found this every time: matter is rearranged, not made or destroyed.",hint:"Look at the “mass in” and “mass out” numbers under the picture."},
 {type:"mcq",q:"Dalton explained the fixed 8 : 1 recipe with atoms. Which explanation fits?",opts:[{t:"Every water particle is the same combination of atoms, and each kind of atom has its own fixed mass, so the masses always add in the same ratio.",ok:1},{t:"Water is mostly oxygen, so oxygen is always in charge of the reaction."},{t:"Atoms of hydrogen and oxygen can’t touch, so they have to be separated by a fixed distance."}],why:"If every water particle is, say, 2 H atoms plus 1 O atom, and every H atom has the same mass and every O atom has the same mass, then any big pile of water has the same mass ratio as one particle.",hint:"What would have to be true about the particles and the atoms inside them for every sample to match?"}
]},
{title:"Two Compounds, One Pair of Elements",tier:1,sub:"Hydrogen and oxygen can make more than one substance. Do their recipes have anything in common?",blocks:[
 {type:"info",html:"Besides water, hydrogen and oxygen can make a second compound, <b>hydrogen peroxide</b>. It is the bubbly stuff in the brown bottle. It has completely different properties from water, so it must be a different recipe."},
 {type:"figure",items:[{"src": "img/h2o2.png", "cap": "Hydrogen peroxide from a pharmacy (label in Russian). The bottle is brown because light makes H₂O₂ slowly break down into water and oxygen.", "alt": "Brown bottle of hydrogen peroxide", "credit": "Public domain · Wikimedia Commons"}]},
 {type:"mcq",predict:true,q:"For 1 g of hydrogen, how much oxygen do you expect peroxide to use? (Water uses 8 g.)",opts:[{t:"8 g, the same as water"},{t:"16 g"},{t:"About 11 g, somewhere in between"},{t:"No way to predict it"}],note:"Now measure it below."},
 {type:"widget",id:"two",tasks:["Combine hydrogen with oxygen to make Compound A (water).","Combine hydrogen with oxygen to make Compound B (peroxide)."]},
 {type:"num",q:"Peroxide uses how many times as much oxygen as water does, for the <b>same mass of hydrogen</b>?",ans:2,tol:0.01,unit:"times",why:"Peroxide: 16 g O per 1 g H. Water: 8 g O per 1 g H. 16 ÷ 8 = 2.",hint:"Divide the oxygen per 1 g H in B by the oxygen per 1 g H in A."},
 {type:"mcq",q:"Why is the answer a clean whole number like 2, and not something like 1.37?",opts:[{t:"Peroxide’s molecule has one whole extra oxygen atom for each one that water has. Atoms come in whole units, so the masses differ by whole-number steps.",ok:1},{t:"Peroxide is just a more concentrated form of water."},{t:"It is a coincidence. It could have been any number."}],why:"This pattern is the Law of Multiple Proportions. You can’t add 0.37 of an atom, so the extra mass from one compound to the next comes in whole-atom jumps.",hint:"Can you add part of an atom to a molecule?"}
]},
{title:"Say It Right",tier:1,sub:"Sort out who said what, and what each of them actually had to back it up.",blocks:[
 {type:"figure",items:[{"src": "img/dalton.png", "cap": "John Dalton, painted by Thomas Phillips (1835). A teacher, like you are, who kept weather records for 57 years.", "alt": "Portrait of John Dalton", "credit": "Public domain · Wikimedia Commons"}]},
 {type:"rows",q:"For each statement, decide who it describes.",choices:["Democritus only","Dalton only","Both"],rows:[
  {q:"Everything is made of tiny pieces that can’t be cut.",ans:2,why:"The shared idea. Democritus proposed it; Dalton revived it."},
  {q:"The idea came from reasoning alone, with no measurements.",ans:0,why:"Democritus argued from logic. He had no balance and no data."},
  {q:"He used measured mass ratios of compounds as evidence.",ans:1,why:"Dalton’s edge was data: the 8 : 1 and 16 : 1 style ratios that Proust, Lavoisier and others measured."},
  {q:"Atoms of different elements have different masses.",ans:1,why:"This is how Dalton explained why the mass ratios in compounds are fixed."},
  {q:"A compound always has the same atoms in the same ratio.",ans:1,why:"Dalton’s postulate that explains the Law of Definite Proportions."}
 ],hint:"Ask: could this statement be backed by a balance reading, or only by an argument?"},
 {type:"mcq",q:"In Dalton’s model, can a chemical reaction turn a hydrogen atom into an oxygen atom?",opts:[{t:"Yes, if you add enough energy."},{t:"No. Reactions only rearrange atoms. They never change one kind into another.",ok:1},{t:"Yes, that’s how water forms."}],why:"Dalton: atoms are neither created, destroyed, nor changed into another kind in a reaction. That’s why mass is conserved and why every atom of hydrogen counts as the same hydrogen.",hint:"What stays fixed about each atom in Dalton’s model?"},
 {type:"mcq",q:"Dalton pictured an atom as a smooth, solid ball with nothing inside. Which of these could that picture <b>not</b> yet explain?",opts:[{t:"Why hydrogen and oxygen always combine in fixed mass ratios."},{t:"Why mass is conserved in a reaction."},{t:"Why rubbing a balloon on your hair makes sparks and static.",ok:1}],why:"Fixed ratios and conserved mass both follow from solid, unchanging atoms. Static charge does not. A ball with no insides has nothing that could carry a charge. That puzzle leads to Day 2.",hint:"Which one has nothing to do with masses of atoms?"}
]},
{title:"Dalton’s Guess",tier:2,sub:"Mass ratios told Dalton how heavy one atom is compared to another, but only if he knew the formula. He had to guess.",blocks:[
 {type:"info",html:"Dalton had no way to count atoms in a molecule. His rule: <b>if two elements make only one compound, assume the simplest formula, 1 atom to 1 atom.</b> For water that means <b>HO</b>. Test what that assumption does to the mass of an oxygen atom."},
 {type:"widget",id:"guess",tasks:["Try Dalton’s guess for water (HO).","Try the modern formula for water (H₂O)."]},
 {type:"num",q:"If water is <b>HO</b>, one oxygen atom is how many times as heavy as one hydrogen atom?",ans:8,tol:0.01,unit:"times",why:"HO is 1 H atom and 1 O atom. The mass ratio O : H is 8 : 1, so one O atom is 8 times heavier than one H atom.",hint:"One atom of each: the atom-mass ratio equals the mass ratio."},
 {type:"num",q:"If water is <b>H₂O</b>, one oxygen atom is how many times as heavy as one hydrogen atom?",ans:16,tol:0.01,unit:"times",why:"Say H = 1 unit. Then 8 g of O goes with 1 g of H, so 16 g of O goes with 2 g of H. H₂O has 2 H atoms (2 units) for one O atom, so one O atom is 16 units: 16 times one H atom.",hint:"H₂O has two H atoms for each O atom. How many grams of O go with 2 g of H?"},
 {type:"mcq",q:"Peroxide has 16 g of oxygen per 1 g of hydrogen. If Dalton’s O atom is 8 times a hydrogen atom (water = HO), what is peroxide’s formula in his system?",opts:[{t:"HO"},{t:"HO₂",ok:1},{t:"H₂O"},{t:"H₂O₂"}],why:"16 g O is twice the 8 g O that makes up one atom’s worth per H. So there are 2 oxygen atoms per hydrogen atom: HO₂.",hint:"How many oxygen atoms’ worth of mass is 16 g if one O atom is worth 8 g?"},
 {type:"mcq",q:"Dalton’s set (HO, HO₂, O = 8) and the modern set (H₂O, H₂O₂, O = 16) <b>both match every mass measurement</b>. What does that tell you?",opts:[{t:"Dalton’s atoms don’t exist."},{t:"Mass ratios alone can’t tell you the number of atoms in a molecule. You need another kind of evidence.",ok:1},{t:"Chemists should always assume 1 : 1."}],why:"Both formula sets give the same mass ratios, so weighing can’t pick between them. Chemists needed other evidence (gas volumes came next) to settle the question.",hint:"Do the two sets of formulas disagree about any mass measurement?"}
]},
{title:"Nitrogen’s Oxides",tier:2,sub:"Nitrogen and oxygen make several compounds. Test whether the multiple-proportions pattern holds up.",blocks:[
 {type:"widget",id:"nox",tasks:["Make all three oxides of nitrogen, using 14 g of nitrogen each time."]},
 {type:"num",q:"Divide the oxygen mass in the <b>biggest</b> oxide by the oxygen mass in the <b>smallest</b>. What do you get?",ans:4,tol:0.01,unit:"times",why:"32 ÷ 8 = 4. The three oxides have 8, 16 and 32 g of O per 14 g N, a 1 : 2 : 4 ratio.",hint:"Biggest oxide: 32 g O. Smallest: 8 g O."},
 {type:"mcq",q:"The oxygen masses (for a fixed mass of nitrogen) are in small whole-number ratios. What is this pattern called?",opts:[{t:"Law of Conservation of Mass"},{t:"Law of Definite Proportions"},{t:"Law of Multiple Proportions",ok:1}],why:"Conservation of mass: mass in = mass out. Definite proportions: one compound, one recipe. Multiple proportions: one pair of elements, several compounds, simple whole-number ratios between recipes.",hint:"This one compares several different compounds made from the same two elements."},
 {type:"num",q:"A fourth oxide of nitrogen is found with <b>24 g</b> of oxygen per 14 g of nitrogen. Divide by the smallest amount (8 g). Does it fit the pattern? Enter the ratio.",ans:3,tol:0.01,unit:"× the smallest",why:"24 ÷ 8 = 3, a whole number. It fits. (It’s N₂O₃, and it’s real.)",hint:"24 ÷ 8."},
 {type:"mcq",q:"Between the 8 g oxide and the 16 g oxide, the extra 8 g of oxygen per 14 g of nitrogen represents…",opts:[{t:"One extra oxygen atom per nitrogen atom, because atoms add in whole numbers.",ok:1},{t:"Half of an oxygen atom."},{t:"Oxygen dissolving in the compound."}],why:"The smallest amount is one atom’s worth (relative to N). The other oxides add whole numbers of those, so the ratios are 1 : 2 : 4. Atoms can’t be split into pieces by chemistry.",hint:"Remember that you can’t add part of an atom."}
]},
{title:"Beyond Dalton",tier:2,sub:"Dalton’s atom is a solid, unbreakable ball. Is that enough?",blocks:[
 {type:"info",html:"Dalton’s model explained conservation of mass, fixed recipes and multiple proportions with one idea. But atoms in his model are featureless balls. Name something you have seen that a featureless, unbreakable ball could <b>not</b> explain."},
 {type:"open",q:"Name an observation (static cling, lightning, a spark when you touch a doorknob, a glowing neon sign, anything) and explain what a solid ball with nothing inside could not explain about it. Then say what an atom would need to have to explain it. Your teacher will read this.",min:60,frame:"Dalton’s model can’t explain ____ because ____. So atoms might need ____."}
]}
]};

function h(tag,attrs,...kids){const e=document.createElement(tag);for(const k in(attrs||{})){if(k==="class")e.className=attrs[k];else if(k==="html")e.innerHTML=attrs[k];else if(k.startsWith("on"))e.addEventListener(k.slice(2),attrs[k]);else e.setAttribute(k,attrs[k])}kids.flat().forEach(c=>{if(c==null)return;e.append(c.nodeType?c:document.createTextNode(c))});return e}
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const SVGNS="http://www.w3.org/2000/svg";
function sv(tag,attrs,...kids){const e=document.createElementNS(SVGNS,tag);for(const k in(attrs||{}))e.setAttribute(k,attrs[k]);kids.flat().forEach(c=>{if(c==null)return;e.append(c.nodeType?c:document.createTextNode(c))});return e}
const PREVIEW=/preview/.test(location.hash),KEYVIEW=/key/.test(location.hash);
const ST={name:"",t0:0,q:0,qFirst:0,retries:0,tasks:0,tasksDone:0,partIdx:0,partsDone:[],preds:[],open:"",between:false};
let inProgress=false,CORE=0,uid=0;
const app=document.getElementById("app"),chipsEl=document.getElementById("chips");
window.addEventListener("beforeunload",e=>{if(inProgress){e.preventDefault();e.returnValue=""}});
const fmtT=s=>{s=Math.floor(s);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
const DONE_TYPES=["mcq","num","rows","widget","open"];
const g=n=>(Math.round(n*100)/100).toString();

/* ---------- widgets ---------- */
const WIDGET={};

WIDGET.halve=(tick)=>{
  /* Model: gold atoms as touching 0.288 nm cubes in a square stack. The start cube is 2^25 atoms along
     each edge (9.7 mm, about 1 cm), so 2^75 atoms in all. Every cut keeps half the atoms. The cuts turn
     x, y, z in order, so the piece is a cube again every third cut. After 75 cuts exactly one atom is left. */
  const ATOM=0.288,MAXN=75,SIZE0=ATOM*Math.pow(2,25),FX=14,FY=12,FW=250,FH=250,DEP=.35;
  const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  const C={f:"#e0b030",t:"#f3d36b",r:"#b88a1c",ln:"#7a5a0c"};
  let n=0,busy=false,raf=0;
  const exps=k=>{const m=MAXN-k;return[Math.ceil((m-2)/3),Math.ceil((m-1)/3),Math.ceil(m/3)].map(v=>Math.max(0,v))};
  const dimsOf=k=>exps(k).map(e=>Math.pow(2,e));
  const longest=k=>ATOM*Math.max(...dimsOf(k));
  const axisCut=k=>{const a=exps(k-1),b=exps(k);return b.findIndex((v,i)=>v<a[i])};
  const fit=D=>Math.min(FW*.78/(D[0]+DEP*D[2]),FH*.78/(D[1]+DEP*D[2]));
  const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,clamp=t=>Math.max(0,Math.min(1,t)),lerp=(a,b,t)=>a+(b-a)*t;
  const SUP="⁰¹²³⁴⁵⁶⁷⁸⁹",sup=v=>String(v).replace(/\d/g,d=>SUP[d]);
  const atomsAt=k=>{const m=MAXN-k;if(m<=20)return Math.pow(2,m).toLocaleString("en-US");const e=Math.floor(m*Math.log10(2));return(Math.pow(2,m)/Math.pow(10,e)).toFixed(1)+"×10"+sup(e)};
  const sig=x=>String(Number(x.toPrecision(2)));
  const fmtSize=nm=>{if(nm>=1e7)return sig(nm/1e7)+" cm";if(nm>=1e6)return sig(nm/1e6)+" mm";if(nm>=1e3)return sig(nm/1e3)+" µm";return sig(nm)+" nm"};
  const LIKE=[[SIZE0,"a sugar cube"],[2e6,"a grain of rice"],[4e5,"a grain of salt"],[8e4,"a human hair’s width"],[3e4,"a skin cell"],[7e3,"a red blood cell"],[1e3,"a bacterium"],[100,"a virus"],[2,"the width of DNA"]];
  const marks=[[SIZE0,"sugar cube"],[1e6,"1 mm"],[1e5,"hair"],[1e3,"bacterium"],[100,"virus"],[2,"DNA"],[ATOM,"gold atom"]];
  const xOf=k=>30+460*k/MAXN;

  const svg=sv("svg",{class:"scene",viewBox:"0 0 520 346",role:"img","aria-label":"A block of gold cut in half again and again, shown zoomed to fit, with its true size and a scale from a sugar cube down to one gold atom"});
  svg.append(sv("defs",{},sv("radialGradient",{id:"augold",cx:".35",cy:".3",r:".75"},sv("stop",{offset:"0","stop-color":"#fff1b8"}),sv("stop",{offset:".45","stop-color":"#e3b21f"}),sv("stop",{offset:"1","stop-color":"#8c6a0e"}))));
  const stat=sv("g"),dyn=sv("g");svg.append(stat,dyn);

  function poly(g,pts,fill){g.append(sv("polygon",{points:pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" "),fill,stroke:C.ln,"stroke-width":1,"stroke-linejoin":"round"}))}
  function ln(g,x1,y1,x2,y2){g.append(sv("line",{x1:x1.toFixed(1),y1:y1.toFixed(1),x2:x2.toFixed(1),y2:y2.toFixed(1),stroke:C.ln,"stroke-opacity":.35,"stroke-width":.6}))}
  /* draw a piece of D=[x,y,z] atoms, one atom = s px, front-face top-left at (x,y) */
  function drawAt(parent,D,s,x,y,alpha){
    const g=sv("g",{opacity:alpha.toFixed(2)}),w=D[0]*s,h=D[1]*s,dp=D[2]*s,px=DEP*dp,py=-DEP*dp;
    if(D[0]*D[1]*D[2]<=256){ // few enough to show every atom, back layer first
      for(let k=D[2]-1;k>=0;k--)for(let j=0;j<D[1];j++)for(let i=0;i<D[0];i++)
        g.append(sv("circle",{cx:(x+(i+.5)*s+k*DEP*s).toFixed(1),cy:(y+(j+.5)*s-k*DEP*s).toFixed(1),r:(s*.46).toFixed(1),fill:"url(#augold)",stroke:C.ln,"stroke-width":.6}));
    }else{
      poly(g,[[x,y],[x+w,y],[x+w+px,y+py],[x+px,y+py]],C.t);
      poly(g,[[x+w,y],[x+w+px,y+py],[x+w+px,y+h+py],[x+w,y+h]],C.r);

  return qCard(h("p",{html:b.q}),...lines,h("div",{class:"row",style:"margin-top:8px"},btn),fb);
};

BLOCK.widget=(b,done)=>{
  const marks=b.tasks.map(()=>false),els=b.tasks.map(t=>h("div",{class:"task"},h("span",{class:"bx"}),h("span",{},t)));
  ST.tasks+=b.tasks.length;
  const tick=i=>{if(marks[i])return;marks[i]=true;ST.tasksDone++;els[i].classList.add("ok");els[i].querySelector(".bx").textContent="✓";if(marks.every(Boolean))done()};
  const w=WIDGET[b.id](tick);
  return h("div",{class:"card"},h("div",{style:"margin-bottom:8px"},h("b",{},"Sim tasks"),els),w);
};


BLOCK.figure=(b)=>{
  const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  const wrap=h("div",{class:"figs"});
  b.items.forEach(it=>{
    const img=new Image(),cv=h("canvas",{role:"img","aria-label":it.alt||it.cap,title:"Click to replay"}),ctx=cv.getContext("2d");
    let run=0;
    function frame(step){ // step = block size in source pixels; 1 = sharp
      const W=cv.width,H=cv.height,sw=Math.max(1,Math.round(W/step)),sh=Math.max(1,Math.round(H/step));
      const t=document.createElement("canvas");t.width=sw;t.height=sh;const tc=t.getContext("2d");tc.imageSmoothingEnabled=true;tc.drawImage(img,0,0,sw,sh);
      ctx.imageSmoothingEnabled=false;ctx.clearRect(0,0,W,H);ctx.drawImage(t,0,0,sw,sh,0,0,W,H)}
    function play(){const id=++run;if(reduce){frame(1);return}[32,16,8,4,2,1].forEach((st,i)=>setTimeout(()=>{if(id===run)frame(st)},i*170))}
    img.onload=()=>{cv.width=img.width;cv.height=img.height;frame(1);
      if("IntersectionObserver" in window){const io=new IntersectionObserver(es=>{if(es[0].isIntersecting){io.disconnect();play()}},{threshold:.4});frame(32);io.observe(cv)}else play()};
    img.src=it.src;cv.addEventListener("click",play);
    wrap.append(h("figure",{class:"pix"},cv,h("figcaption",{},it.cap,h("div",{class:"cr"},it.credit||""))));
  });
  return h("div",{class:"card"},wrap);
};

BLOCK.open=(b,done)=>{
  const ta=h("textarea",{"aria-label":"Your response",placeholder:b.frame}),cnt=h("span",{class:"hint"},"0 / "+b.min+" characters");const fb=feedback();
  const btn=h("button",{class:"btn",disabled:"",onclick:()=>{ST.open=ta.value.trim();ta.disabled=true;btn.disabled=true;show(fb,true,"✔ Saved. Show your teacher the final screen.");done()}},"Save my answer");
  ta.addEventListener("input",()=>{cnt.textContent=ta.value.trim().length+" / "+b.min+" characters";btn.disabled=ta.value.trim().length<b.min});
  return qCard(h("p",{html:b.q}),ta,h("div",{class:"row",style:"margin-top:8px"},btn,cnt),fb);
};

/* ---------- part runner ---------- */
function chips(){chipsEl.replaceChildren(...DATA.parts.map((p,i)=>h("span",{class:"chip"+(ST.partsDone[i]?" done":i===ST.partIdx&&!ST.between?" on":"")},(ST.partsDone[i]?"✓ ":"")+(p.tier===2?"★":"")+(i+1))))}
function showPart(i){
  ST.between=false;ST.partIdx=i;chips();app.replaceChildren();window.scrollTo(0,0);
  const P=DATA.parts[i];
  app.append(h("h2",{},`Part ${i+1} of ${DATA.parts.length}: ${P.title}`,P.tier===2?h("span",{class:"tier"},"CHALLENGE"):null),h("p",{class:"sub"},P.sub));
  const last=i===DATA.parts.length-1,coreEnd=i===CORE-1;
  const advance=()=>{ST.partsDone[i]=true;if(last)showFinal();else if(coreEnd)showCore();else showPart(i+1)};
  const nextBtn=h("button",{class:"btn big",disabled:"",onclick:advance},last?"Finish ✔":coreEnd?"Finish core ✔":"Next part →");
  const nextWrap=h("div",{class:"row",style:"justify-content:center;margin:20px 0"},nextBtn);
  if(PREVIEW)nextWrap.append(h("button",{class:"ghost",onclick:advance},"Skip (preview)"));
  const needed=P.blocks.filter(b=>DONE_TYPES.includes(b.type)).length;let got=0,idx=0;const cards=[];
  const unlock=()=>{if(got===needed){nextBtn.disabled=false;nextBtn.removeAttribute("disabled")}};
  const reveal=()=>{
    while(idx<P.blocks.length){
      const b=P.blocks[idx++];let fin=false;
      const card=BLOCK[b.type](b,()=>{if(fin)return;fin=true;got++;unlock();reveal()});
      card._b=b;cards.push(card);app.append(card);
      if(DONE_TYPES.includes(b.type)&&!fin)break;
    }
    app.append(nextWrap);unlock();
  };
  reveal();window.__cards=cards;
}
function summaryText(label){
  const secs=(Date.now()-ST.t0)/1000,when=new Date();
  let t=`${ST.name} · Atom Discovery (Unit 3 Day 1) · ${label} · time ${fmtT(secs)} · questions right on the first try ${ST.qFirst}/${ST.q} · retries ${ST.retries} · sim tasks ${ST.tasksDone}/${ST.tasks} · ${when.toLocaleDateString()} ${when.toLocaleTimeString()}`;
  if(ST.open)t+=` · Beyond Dalton: "${ST.open.slice(0,400)}"`;
  return t;
}
function stampCard(title,label,extra){
  const secs=(Date.now()-ST.t0)/1000,when=new Date(),txt=summaryText(label);
  const st=h("div",{class:"stamp"},h("div",{class:"big"},title),h("div",{style:"font-size:24px;margin:4px 0"},ST.name),h("div",{},`${when.toLocaleDateString()} · ${when.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})}`));
  const tbl=h("table",{class:"sum"},
    h("tr",{},h("th",{},"Time"),h("td",{},fmtT(secs))),
    h("tr",{},h("th",{},"Sim tasks finished"),h("td",{},`${ST.tasksDone} of ${ST.tasks}`)),
    h("tr",{},h("th",{},"Questions right on the first try"),h("td",{},`${ST.qFirst} of ${ST.q}`)),
    h("tr",{},h("th",{},"Times you fixed a wrong answer"),h("td",{},String(ST.retries))));
  const copy=h("button",{class:"ghost",onclick:async()=>{try{await navigator.clipboard.writeText(txt);copy.textContent="Copied ✔"}catch(e){copy.textContent="Select and copy the line below"}}},"Copy summary");
  return[st,tbl,h("div",{class:"row",style:"justify-content:center"},copy,...(extra||[])),h("p",{class:"hint",style:"word-break:break-word"},txt)];
}
function showCore(){
  ST.between=true;chips();app.replaceChildren();window.scrollTo(0,0);
  const go=h("button",{class:"btn big",onclick:()=>showPart(CORE)},"★ Keep going: Challenge tier →");
  app.append(h("div",{class:"card final"},h("h2",{},"Core complete! 🎉"),h("p",{},"Show this screen to Mr. D, then finish your core takeaways on your sheet. If you still have time, the Challenge tier is harder and different."),...stampCard("✔ CORE COMPLETE","CORE COMPLETE (parts 1-"+CORE+")",[go])));
}
function showFinal(){
  inProgress=false;chips();app.replaceChildren();window.scrollTo(0,0);
  app.append(h("div",{class:"card final"},h("h2",{},"Challenge complete! 🏆"),h("p",{},"Show this screen to Mr. D. Then finish the Challenge takeaways on your sheet."),...stampCard("★ CHALLENGE COMPLETE","ALL "+DATA.parts.length+" PARTS COMPLETE (core + challenge)")));
}
function start(){inProgress=true;ST.t0=Date.now();showPart(0)}

/* ---------- teacher key (#key) ---------- */
const WIDGET_KEY={
 halve:"Halving widget. Each cut keeps half the gold, so it halves the atom count. The start cube is 2²⁵ atoms along an edge (9.7 mm, about 1 cm), so 2⁷⁵ ≈ 3.8 × 10²² atoms. Cuts turn x, y, z in order, so the side halves only every third cut and the piece is a cube again every third cut. One atom is left at exactly 75 cuts, then the cut buttons disable. Individual atoms are drawn for the last 8 cuts.",
 water:"Water widget. Fixed 8 : 1 O:H by mass. Trials: perfect (e.g. 2 g H + 16 g O), O left over (e.g. 2 g H + 30 g O), H left over (e.g. 5 g H + 16 g O). Mass in always equals mass out.",
 two:"Two-compound widget. A (water) = 8 g O per 1 g H. B (peroxide) = 16 g O per 1 g H.",
 guess:"Formula toggle. HO gives O atom = 8 × H atom and peroxide HO₂. H₂O gives O atom = 16 × H atom and peroxide H₂O₂. Both fit the mass data.",
 nox:"Three oxides with 14 g N: oxide X 8 g O, Y 16 g O, Z 32 g O (really N₂O, NO, NO₂). Ratio 1 : 2 : 4."
};
const strip=s=>String(s).replace(/<[^>]+>/g,"");
function showKey(){
  chipsEl.replaceChildren();app.replaceChildren();
  app.append(h("div",{class:"card"},h("h2",{},"Teacher key"),h("p",{},"Every answer with the reason the student sees. Open the page without #key for the student version. Add #preview to the address for skip buttons.")));
  const key=h("div",{class:"key"});
  DATA.parts.forEach((P,i)=>{
    key.append(h("h3",{},`Part ${i+1}${P.tier===2?" ★ Challenge":""}: ${P.title}`));
    P.blocks.forEach(b=>{
      if(b.type==="mcq"){const ok=b.predict?null:b.opts.find(o=>o.ok);key.append(h("div",{class:"it",html:`<b>${b.predict?"[Predict, any answer accepted] ":""}${b.q}</b><br>`+(b.predict?`Options: ${b.opts.map(o=>o.t).join(" / ")}`:`✔ ${ok.t}<br><i>${b.why}</i>`)}))}
      if(b.type==="num")key.append(h("div",{class:"it",html:`<b>${b.q}</b><br>✔ ${[].concat(b.ans).join(" or ")} ${b.unit||""} (±${b.tol})<br><i>${b.why}</i>`}));
      if(b.type==="rows")key.append(h("div",{class:"it",html:`<b>${b.q}</b>`+b.rows.map(r=>`<br>• ${r.q} → <b>${b.choices[r.ans]}</b>. <i>${r.why}</i>`).join("")}));
      if(b.type==="widget")key.append(h("div",{class:"it",html:`<b>Sim tasks:</b> ${b.tasks.join(" ")}<br><i>${WIDGET_KEY[b.id]}</i>`}));
      if(b.type==="open")key.append(h("div",{class:"it",html:`<b>${b.q}</b><br>Open response (teacher reads it in the copied summary). Good answers: static cling or sparks → atoms must contain charged parts that can move; neon glow → atoms can give off light, so they must have an inside that can change; lightning → charge is a property of matter. Accept any observation that a mass-only ball cannot explain, paired with a reasonable “atoms need…”.`}));
    });
  });
  app.append(key);
}

/* ---------- boot ---------- */
CORE=DATA.parts.filter(p=>p.tier===1).length;
if(KEYVIEW){showKey()}
else{
  chips();
  const i=h("input",{type:"text",id:"nm",placeholder:"First and last name",autocomplete:"off"});
  const b=h("button",{class:"btn big",style:"margin-top:12px",onclick:()=>{const v=i.value.trim();if(!v){i.focus();return}ST.name=v;start()}},"Start →");
  i.addEventListener("keydown",e=>{if(e.key==="Enter")b.click()});
  app.append(h("div",{class:"card",id:"start"},h("h2",{},"Atom Discovery"),
    h("p",{},"Predict first, then run the sim to see if you were right. A wrong answer gives a hint and you try again. Please don’t refresh the page."),
    h("p",{},`Parts 1 to ${CORE} are the core. Parts marked ★ are the Challenge tier: harder, and different in kind. Do the Cold Open on your sheet before you start.`),
    h("p",{},h("b",{},"Your name:")),i,h("div",{},b)));
}
window.__qa={ST,DATA,WIDGET,BLOCK,cards:()=>window.__cards||[]};
</script>
