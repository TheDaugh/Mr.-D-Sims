<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Energy Diorama · Mr. D's Sims</title>
<meta name="description" content="Pick a textbook reaction and an amount. A flat isometric town shows how much energy it gives off.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b141d;--panel:#122030;--panel2:#1a2c40;--ink:#eaf0f6;--muted:#9fb0c1;--line:#28405a;--cy:#19c9e6;--or:#ff9d2e;--bad:#ff6f5a}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 "Source Sans 3",system-ui,sans-serif;overflow:hidden}
h1,h2{font-family:"Bricolage Grotesque","Source Sans 3",system-ui,sans-serif;margin:0}
button{font:inherit;color:inherit}
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;gap:16px;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
header h1{font-size:1.35rem}header .sp{flex:1}
.hbtn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 16px;cursor:pointer}
#main{flex:1;display:flex;min-height:0}
#left{width:380px;flex:none;padding:14px 16px;border-right:1px solid var(--line);overflow:auto}
#left h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-family:"Source Sans 3",sans-serif;margin:0 0 8px}
.rx{display:block;width:100%;text-align:left;margin:0 0 8px;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--panel2);cursor:pointer;font-weight:700;font-size:1.02rem}
.rx[aria-pressed=true]{border-color:var(--cy)}
.rx small{display:block;color:var(--muted);font-weight:600;font-size:.82rem}
#amtbox{margin-top:16px}
#amt{width:100%}
#amtv{font:800 1.3rem "Bricolage Grotesque",sans-serif;margin:4px 0}
#right{flex:1;min-width:0;display:flex;flex-direction:column}
#stagewrap{flex:1;position:relative;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#bottom{display:flex;gap:20px;align-items:center;padding:14px 20px;border-top:1px solid var(--line);background:var(--panel);flex:none}
#meter{flex:1}
#meter .l{font-size:.76rem;font-weight:700;letter-spacing:.07em;color:var(--muted);white-space:nowrap}
#meter .v{font:800 1.8rem "Bricolage Grotesque",sans-serif;line-height:1.1}
#meter canvas{width:100%;height:46px;display:block}
.big{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-weight:700;font-size:1rem;padding:0 22px}
.big.go{background:var(--cy);border-color:var(--cy);color:#02141a}
.big:disabled{opacity:.4;cursor:not-allowed}
.overlay{position:fixed;inset:0;background:rgba(6,10,16,.93);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.overlay[hidden]{display:none}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 22px;max-width:640px;width:100%}
.sheet h2{font-size:1.5rem;margin-bottom:6px}.sheet p{margin:6px 0}
.small{color:var(--muted);font-size:.92rem}
.hint.bad{color:#ff8a73;min-height:1.2em;margin:4px 0}
.mrd-idask label{margin-right:12px}
.mrd-idask input{background:#0b121a;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 8px;font-size:1.05rem}
.mrd-idask .hint{margin:4px 0 0;color:var(--muted);font-size:.9rem}
.mrd-idask .hint.ok{color:#59d596}.mrd-idask .hint.bad{color:#ff8a73}
</style>
</head>
<body>
<div id="app">
  <header><h1>Energy Diorama</h1><span class="sp"></span><button class="hbtn" id="btnKey" hidden>Teacher key</button></header>
  <div id="main">
    <div id="left"><h2>Reaction</h2><div id="rxlist"></div>
      <div id="amtbox"><h2>Amount</h2><div id="amtv"></div><input id="amt" type="range" min="0" max="18" step="1" value="0" aria-label="Amount of the reaction"></div></div>
    <div id="right">
      <div id="stagewrap"><canvas id="cv"></canvas></div>
      <div id="bottom"><div id="meter"><div class="l">ENERGY RELEASED</div><div class="v" id="ev">0 kJ</div><canvas id="mc" width="900" height="46"></canvas></div>
        <button class="big go" id="bGo">React</button><button class="big" id="bReset">Reset</button></div>
    </div>
  </div>
</div>
<div class="overlay" id="start" hidden><div class="sheet"><h2>Energy Diorama</h2><p>Pick a reaction. Pick an amount. Press React.</p>
  <div id="idHost"></div><p class="small" id="lockNote" hidden>During class this opens in full screen. Leaving it is counted, and the teacher has to see you to unlock it.</p>
  <p class="hint bad" id="startMsg"></p><button class="big go" id="bBegin" disabled>Begin</button></div></div>
<div class="overlay" id="lockres" hidden><div class="sheet"><h2>🔒 Locked. Hand up, eyes forward.</h2><p id="lockresTxt"></p>
  <input id="lockCode" aria-label="Unlock code from the teacher" autocomplete="off" style="background:#0b121a;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px;font-size:1.1rem">
  <button class="big" id="bUnlock" style="margin-left:8px">Unlock</button><p class="hint bad" id="lockMsg"></p></div></div>
<div class="overlay" id="keyPage" hidden><div class="sheet" id="keyBody"></div></div>

<script src="../../shared/bell.js"></script>
<script src="../../shared/codes.js"></script>
<script src="../../shared/lock.js"></script>
<script src="../../shared/profile.js"></script>
<script src="../../shared/ids.js"></script>
<script>
(function () {
  "use strict";
  var MrD = window.MrD, $ = function (id) { return document.getElementById(id); };
  var KEY = /key/.test(location.hash), NOLOCK = (/nolock=(\d+)/.exec(location.hash) || [])[1];
  var LESSON_ID = "chem-u4-energy-diorama", COURSE = "chem", lockArmed = false, askH = null, started = false;

  /* Textbook reactions only. kJ released per reaction as written (standard enthalpies of formation, magnitude; energy out in every one). */
  var RX = [
    { eq: "2 Na + Cl₂ → 2 NaCl", kj: 822, name: "Table salt forming" },
    { eq: "2 H₂ + O₂ → 2 H₂O", kj: 572, name: "Water forming" },
    { eq: "H₂ + Cl₂ → 2 HCl", kj: 184, name: "Hydrogen chloride forming" },
    { eq: "N₂ + 3 H₂ → 2 NH₃", kj: 92, name: "Ammonia forming" },
    { eq: "C + O₂ → CO₂", kj: 394, name: "Carbon burning" },
    { eq: "CH₄ + 2 O₂ → CO₂ + 2 H₂O", kj: 890, name: "Methane burning" },
    { eq: "C₃H₈ + 5 O₂ → 3 CO₂ + 4 H₂O", kj: 2220, name: "Propane burning" },
    { eq: "2 Mg + O₂ → 2 MgO", kj: 1204, name: "Magnesium burning" },
    { eq: "2 Ca + O₂ → 2 CaO", kj: 1270, name: "Calcium burning" },
    { eq: "2 K + Cl₂ → 2 KCl", kj: 872, name: "Potassium chloride forming" },
    { eq: "4 Al + 3 O₂ → 2 Al₂O₃", kj: 3352, name: "Aluminum burning" }
  ];
  var S = { rx: 0, step: 0, t0: null };
  function amount() { return [1, 2, 5][S.step % 3] * Math.pow(10, Math.floor(S.step / 3)); }
  function energy() { return RX[S.rx].kj * amount(); }
  function fmtE(kj) { return kj >= 1e9 ? (kj / 1e9).toPrecision(3) + " TJ" : kj >= 1e6 ? (kj / 1e6).toPrecision(3) + " GJ" : kj >= 1e3 ? (kj / 1e3).toPrecision(3) + " MJ" : Math.round(kj) + " kJ"; }
  function fmtN(n) { return n.toLocaleString("en-US"); }

  /* ---------- the town: flat isometric blocks, same palette idea as the lab room ---------- */
  var N = 13, C = 6, TW = 64, TH = 32, cv = $("cv"), g = cv.getContext("2d"), W = 0, H = 0, DPR = Math.max(1, Math.min(2, window.devicePixelRatio || 1)), ox = 0, oy = 0;
  function rng(s) { return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
  var objs = (function () {
    var r = rng(7), a = [], i, j, k = 0;
    for (i = 0; i < N; i++) for (j = 0; j < N; j++) {
      if (i === C && j === C) continue;
      var road = (i === 3 || i === 9 || j === 3 || j === 9);
      if (road) { a.push({ i: i, j: j, kind: "road" }); continue; }
      var d = Math.hypot(i - C, j - C), v = r();
      if (d < 1.5) { a.push({ i: i, j: j, kind: "grass" }); continue; }
      if (v < 0.5) a.push({ i: i, j: j, kind: "house", h: 26 + Math.floor(r() * 46), col: ["#e8c46a", "#d98a6c", "#9bb7d4", "#c9a7d8", "#8fc9a0"][k++ % 5] });
      else if (v < 0.75) a.push({ i: i, j: j, kind: "tree", h: 22 + Math.floor(r() * 12) });
      else a.push({ i: i, j: j, kind: "grass" });
    }
    return a;
  })();
  function fit() { var r = cv.getBoundingClientRect(); W = r.width; H = r.height; cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); ox = W / 2; oy = H * 0.5 - (N * TH) / 2 + 16; var s = Math.min(W / (N * TW * 1.02), H / (N * TH + 160)); TW = 64 * s; TH = 32 * s; ox = W / 2; oy = H * 0.5 - (N * TH) / 2 + 20 * s; }
  function P(i, j) { return [ox + (i - j) * TW / 2, oy + (i + j) * TH / 2]; }
  function shade(hex, f) { var n = parseInt(hex.slice(1), 16), r = Math.max(0, Math.min(255, Math.round((n >> 16) * f))), gg = Math.max(0, Math.min(255, Math.round(((n >> 8) & 255) * f))), b = Math.max(0, Math.min(255, Math.round((n & 255) * f))); return "rgb(" + r + "," + gg + "," + b + ")"; }
  function mix(a, b, t) { var A = parseInt(a.slice(1), 16), B = parseInt(b.slice(1), 16), m = function (s) { return Math.round(((A >> s) & 255) * (1 - t) + ((B >> s) & 255) * t); }; return "#" + ((1 << 24) | (m(16) << 16) | (m(8) << 8) | m(0)).toString(16).slice(1); }
  function box(i, j, h, col, w) {      // a flat isometric block: three faces, no gradients
    w = w || 1; var o = (1 - w) / 2, p0 = P(i + o, j + o), p1 = P(i + o + w, j + o), p2 = P(i + o + w, j + o + w), p3 = P(i + o, j + o + w), z = h * TH / 32;
    g.fillStyle = shade(col, 0.72); g.beginPath(); g.moveTo(p3[0], p3[1]); g.lineTo(p2[0], p2[1]); g.lineTo(p2[0], p2[1] - z); g.lineTo(p3[0], p3[1] - z); g.closePath(); g.fill();
    g.fillStyle = shade(col, 0.55); g.beginPath(); g.moveTo(p2[0], p2[1]); g.lineTo(p1[0], p1[1]); g.lineTo(p1[0], p1[1] - z); g.lineTo(p2[0], p2[1] - z); g.closePath(); g.fill();
    g.fillStyle = shade(col, 1); g.beginPath(); g.moveTo(p0[0], p0[1] - z); g.lineTo(p1[0], p1[1] - z); g.lineTo(p2[0], p2[1] - z); g.lineTo(p3[0], p3[1] - z); g.closePath(); g.fill();
  }
  function rmax() { return Math.max(0, Math.min(9.5, (Math.log10(Math.max(1, energy())) - 1.5) / 8 * 9.5)); }
  var SPEED = 4.2;        // tiles per second, the front of the release
  function frame(ts) {
    g.setTransform(DPR, 0, 0, DPR, 0, 0); g.clearRect(0, 0, W, H); g.imageSmoothingEnabled = false;
    var t = S.t0 == null ? -1 : (ts - S.t0) / 1000, R = rmax(), front = t < 0 ? -1 : t * SPEED, list = objs, i;
    var cell = {}; list.forEach(function (o) { cell[o.i + "," + o.j] = o; });
    for (var s = 0; s <= 2 * (N - 1); s++) for (i = 0; i < N; i++) { var jj = s - i; if (jj < 0 || jj >= N) continue; tile(i, jj, cell[i + "," + jj] || { kind: "bench" }, front, R, t); }
    if (t >= 0 && t < 3) { g.fillStyle = "rgba(255,240,200," + (0.5 * (1 - t / 3)) + ")"; g.fillRect(0, 0, W, H); }
    requestAnimationFrame(frame);
  }
  function tile(i, j, o, front, R, t) {
    var d = Math.hypot(i - C, j - C), hit = front >= d && d <= R + 0.4, age = hit ? Math.min(1, (front - d) / 2.5) : 0, near = d <= R * 0.55, ground = (i + j) % 2 ? "#33503a" : "#38573f";
    if (o.kind === "road") ground = "#4a5260";
    if (hit) { var hot = 1 - age; ground = mix(near || d <= R ? (near ? "#3a2a22" : "#4b3b2c") : ground, "#ffb347", hot * 0.9); if (near && age >= 1) ground = "#2c2420"; }
    var p0 = P(i, j), p1 = P(i + 1, j), p2 = P(i + 1, j + 1), p3 = P(i, j + 1);
    g.fillStyle = ground; g.beginPath(); g.moveTo(p0[0], p0[1]); g.lineTo(p1[0], p1[1]); g.lineTo(p2[0], p2[1]); g.lineTo(p3[0], p3[1]); g.closePath(); g.fill();
    if (o.kind === "house") {
      var h = o.h, col = o.col; if (hit) { if (d <= R * 0.62) { h = o.h * (1 - 0.8 * Math.min(1, age * 1.3)); col = mix(o.col, "#2c2420", Math.min(1, age)); } else col = mix(o.col, "#ffb347", (1 - age) * 0.8); }
      box(i, j, h, col, 0.72); if (h > 14 && !hit) box(i, j, h + 6, "#a8584a", 0.44);
    } else if (o.kind === "tree") {
      var tt = hit && d <= R * 0.85;
      box(i, j, tt ? 5 : 10, "#6b4a2e", 0.24); if (!tt) box(i, j, o.h, hit ? mix("#3f9a55", "#ffb347", (1 - age) * 0.8) : "#3f9a55", 0.6); else box(i, j, 6, "#2c2420", 0.5);
    } else if (o.kind === "bench") {
      box(i, j, 14, "#8b6f4a", 0.9); var glow = t >= 0 ? Math.max(0, 1 - t / 1.2) : 0; box(i, j, 30, mix("#bcd4e8", "#fff3c4", glow), 0.34);
    }
  }
  /* ---------- the magnitude meter: log scale from 1 kJ to 10 TJ ---------- */
  function meter(frac) {
    var m = $("mc"), c = m.getContext("2d"), w = m.width, h = m.height; c.clearRect(0, 0, w, h); c.fillStyle = "#0b1520"; c.fillRect(0, 14, w, 12);
    var lo = 0, hi = 10, v = Math.log10(Math.max(1, energy())) * frac; c.fillStyle = "#ff9d2e"; c.fillRect(0, 14, Math.max(3, w * (v - lo) / (hi - lo)), 12);
    c.fillStyle = "#9fb0c1"; c.font = "600 13px 'Source Sans 3', sans-serif"; c.textAlign = "center";
    [["1 kJ", 0], ["1 MJ", 3], ["1 GJ", 6], ["1 TJ", 9]].forEach(function (x) { var px = w * x[1] / 10; c.fillRect(px, 10, 2, 20); c.fillText(x[0], Math.min(w - 20, Math.max(20, px)), 44); });
  }
  var shown = 0;
  function ui() {
    $("amtv").textContent = fmtN(amount()) + " × the reaction as written";
    $("ev").textContent = fmtE(energy() * shown); meter(shown);
  }
  function tick() { if (S.t0 != null) { var t = (performance.now() - S.t0) / 1000; shown = Math.min(1, t / 2); ui(); } requestAnimationFrame(tick); }
  function build() {
    var host = $("rxlist"); RX.forEach(function (r, i) { var b = document.createElement("button"); b.className = "rx"; b.innerHTML = r.eq + "<small>" + r.name + "</small>"; b.setAttribute("aria-pressed", String(i === 0)); b.onclick = function () { S.rx = i; S.t0 = null; shown = 0; host.querySelectorAll(".rx").forEach(function (x, k) { x.setAttribute("aria-pressed", String(k === i)); }); ui(); }; host.appendChild(b); });
    $("amt").oninput = function () { S.step = +this.value; S.t0 = null; shown = 0; ui(); };
    $("bGo").onclick = function () { if (!started && !KEY) return; S.t0 = performance.now(); log("react:" + RX[S.rx].eq + "×" + amount()); };
    $("bReset").onclick = function () { S.t0 = null; shown = 0; ui(); };
  }
  var evlog = []; function log(s) { evlog.push([Date.now(), s]); try { MrD.profile.record({ course: COURSE, lesson: LESSON_ID, title: "Energy Diorama", first: S.id || "key", period: S.period || "", day: MrD.bell.dayKey(), reached: evlog.length, of: evlog.length, items: [{ skill: "chem.energy.magnitude", band: 1, firstTry: true, ok: true }], source: "sandbox" }); } catch (e) { } }

  /* ---------- start and locked mode (same as the Trends Lab) ---------- */
  function clk() { return MrD.bell.clock(COURSE); }
  function lockWanted() { return !KEY && !!S.id && NOLOCK !== LessonLock.offCode() && !!clk().lockOn; }
  function go() { started = true; $("start").hidden = true; $("lockres").hidden = true; }
  function begin() {
    var info = askH.get(); if (!info.valid) return; S.id = info.id; S.period = info.period; MrD.ids.setMe(S.id, S.period);
    if (!lockWanted()) { go(); return; }
    LessonLock.enter(S.id).then(function (ok) { if (!ok) { $("startMsg").textContent = "Full screen did not start. This needs Chrome on your Chromebook. Tell the teacher."; return; } lockArmed = true; go(); });
  }
  function lockResumeCard() {
    $("start").hidden = true; $("lockres").hidden = false; $("lockresTxt").textContent = "You closed this page. That is lock number " + LessonLock.lockNo() + ". The teacher needs to see you and give you a code.";
    var inp = $("lockCode"); inp.focus(); var tryIt = function () { LessonLock.resume(inp.value).then(function (r) { if (r === "ok") { lockArmed = true; go(); } else $("lockMsg").textContent = r === "nofs" ? "Full screen did not start. Click again." : "Not the code. Hand up and wait."; }); };
    $("bUnlock").onclick = tryIt; inp.onkeydown = function (e) { if (e.key === "Enter") tryIt(); };
  }
  function openKey() {
    var rows = RX.map(function (r) { return "<tr><td>" + r.eq + "</td><td style='text-align:right'>" + r.kj + "</td></tr>"; }).join("");
    $("keyBody").innerHTML = "<h2>Teacher key: Energy Diorama</h2><p>Energy is released in every reaction listed. Values are standard enthalpies of formation or combustion, per reaction as written. The town responds to the log of the energy: the glow reaches farther, houses flatten and trees burn at larger amounts. No procedures, only textbook reactions.</p><p><b>Unlock code for a locked student today:</b> " + (MrD.codes && MrD.codes.override ? MrD.codes.override() : "see the teacher page") + "</p><table style='border-collapse:collapse'><tr><th style='text-align:left'>Reaction</th><th>kJ released</th></tr>" + rows + "</table><p><button class='big' id='keyClose'>Close</button></p>";
    $("keyPage").hidden = false; $("keyClose").onclick = function () { $("keyPage").hidden = true; };
  }
  function boot() {
    build(); fit(); window.addEventListener("resize", fit); if (window.ResizeObserver) new ResizeObserver(fit).observe($("stagewrap")); ui(); requestAnimationFrame(frame); requestAnimationFrame(tick);
    if (KEY) { $("start").hidden = true; started = true; $("btnKey").hidden = false; $("btnKey").onclick = openKey; return; }
    LessonLock.init({ id: LESSON_ID, root: $("app"), onChange: function () { } });
    var me = MrD.ids.me(); if (me) { S.id = me.id; S.period = me.period; }
    if (NOLOCK !== LessonLock.offCode() && clk().lockOn && LessonLock.pending()) { lockResumeCard(); return; }
    $("start").hidden = false; $("lockNote").hidden = !(clk().lockOn && NOLOCK !== LessonLock.offCode());
    askH = MrD.ids.ask($("idHost"), { onChange: function (i) { $("bBegin").disabled = !i.valid; $("startMsg").textContent = ""; } }); $("bBegin").addEventListener("click", begin);
  }
  window.__ed = { S: S, energy: energy, amount: amount, rmax: rmax };
  boot();
})();
</script>
</body>
</html>
